name: CI and immutable images

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests, E2E and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_build_required: ${{ steps.image_scope.outputs.required }}
    permissions:
      contents: read
    services:
      postgres:
        # Official PostgreSQL 17 image, verified by pull and pinned by digest.
        # The public ECR mirror rejected CI pulls with "Data limit exceeded".
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: crm_silmer_test
          POSTGRES_PASSWORD: issue12-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_silmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether PR changes affect images
        id: image_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
            .dockerignore \
            .github/workflows/ci.yml \
            jsconfig.json \
            package.json \
            package-lock.json \
            apps \
            modules \
            scripts \
            docker; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Reject merge commits in pull request history
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_commits="$(git rev-list --merges "$PR_BASE_SHA..$PR_HEAD_SHA")"
          if [[ -n "$merge_commits" ]]; then
            echo '::error::PR branch contains merge commits. Rebase it onto the current base branch.'
            git log --oneline --merges "$PR_BASE_SHA..$PR_HEAD_SHA"
            exit 1
          fi
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Decide whether PR dependencies changed
        id: dependency_scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr-dependency-scope.mjs
      - name: Install exact dependencies
        run: npm ci
      - name: Restore Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium-firefox
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Prepare synthetic audio playback
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1 --load="module-null-sink sink_name=playwright"
      - name: Run static, unit and build gates
        run: npm run validate
      - name: Verify real edge media policies and upload limits
        run: node scripts/check-edge-media-proxy.mjs
      - name: Run serialized PostgreSQL gates
        env:
          TEST_DATABASE_URL: postgresql://postgres:issue12-ci-only@127.0.0.1:5432/crm_silmer_test
        run: npm run test:identity:live && npm run test:webhook:live && npm run test:worker:live && npm run test:deal:live && npm run test:finance:live && node --test --test-concurrency=1 test/inbox-postgres-live.test.js test/inbound-media-postgres-live.test.js test/n8n-integration-postgres-live.test.js test/chat-media-bind-postgres-live.test.js test/painel-summary-postgres-live.test.js test/contact-registration-postgres-live.test.js test/vendedor-evolucao-postgres-live.test.js test/shipping-postgres-live.test.js
      - name: Run E2E and accessibility gates
        run: npm run test:e2e
      - name: Scan production dependencies
        run: npm audit --audit-level=high
      - name: Reject generated diff
        run: git diff --check && test -z "$(git status --short)"
      # Dependency changes require review in every repository. Code-only PRs
      # do not need this service; npm audit above remains unconditional.
      - name: Review dependency changes
        if: github.event_name == 'pull_request' && steps.dependency_scope.outputs.required == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  images:
    name: Build and scan ${{ matrix.image }}
    needs: quality
    # Runs even when images are unaffected: a skipped matrix job never expands
    # its name, so the required "Build and scan <image>" checks would never report.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BUILD_REQUIRED: ${{ needs.quality.outputs.image_build_required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: edge-web
            dockerfile: docker/edge-web.Dockerfile
          - image: runtime
            dockerfile: docker/runtime.Dockerfile
    steps:
      - name: Check out approved source
        if: env.IMAGE_BUILD_REQUIRED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        if: env.IMAGE_BUILD_REQUIRED == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build one local OCI layout
        if: env.IMAGE_BUILD_REQUIRED == 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: ${{ github.event_name == 'push' && 'mode=max' || false }}
          pull: true
          sbom: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          outputs: type=oci,dest=/tmp/${{ matrix.image }}-oci,tar=false
          tags: crm-silmer/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Scan local OCI layout with Trivy
        if: env.IMAGE_BUILD_REQUIRED == 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: /tmp/${{ matrix.image }}-oci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Log in to GHCR after the scan passes
        if: env.IMAGE_BUILD_REQUIRED == 'true' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned OCI layout without rebuilding
        if: env.IMAGE_BUILD_REQUIRED == 'true' && github.event_name == 'push'
        id: release
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          OCI_LAYOUT: /tmp/${{ matrix.image }}-oci
          RELEASE_TAG: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
        run: |
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          skopeo copy --all --preserve-digests \
            "oci:$OCI_LAYOUT" "docker://$RELEASE_TAG"
          # Consume all inspector output so pipefail cannot reject a successful
          # inspection when its producer encounters an early closed pipe.
          release_digest="$(docker buildx imagetools inspect "$RELEASE_TAG" | awk '/^Digest:/ && !seen++ { print $2 }')"
          test "$release_digest" = "$EXPECTED_DIGEST"
          printf 'digest=%s\n' "$release_digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable digest
        if: env.IMAGE_BUILD_REQUIRED == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          test "${{ steps.release.outputs.digest }}" != ""
          printf '%s=%s@%s\n' '${{ matrix.image }}' \
            'ghcr.io/${{ github.repository }}/${{ matrix.image }}' \
            '${{ steps.release.outputs.digest }}' | tee digest.env
      - name: Upload digest reference
        if: env.IMAGE_BUILD_REQUIRED == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}-${{ github.sha }}
          path: digest.env
          if-no-files-found: error
          retention-days: 30
