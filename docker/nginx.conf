error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # T138: OAuth callback query strings and Referer never enter access logs.
  log_format crm_safe '$request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout crm_safe;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  server_tokens off;

  # Use the original path because try_files may change $uri to /index.html.
  map $request_uri $oauth_cache_control {
    default "";
    ~^/melhor-envio(?:\?|$) "private, no-store";
    ~^/olist(?:\?|$) "private, no-store";
  }

  # The print endpoint renders a fixed stylesheet inside its HTML document.
  # Only this path may use the exact v2/v3/v4/v5/v6 template stylesheets and
  # the site shop's simplified ficha (ficha-loja-v1, ADR 027).
  # When a template stylesheet changes, update its hash and the print CSP test.
  map $uri $print_style_sources {
    default "";
    ~^/api/v1/orders/[^/]+/print$ "'sha256-s6R1oV8EC8N702qjyiwWMMp/wSW/metuIHAUYGbOV3c=' 'sha256-AERJOeNXlxDPRu2BXxQuFgDq2dzis2QxtmbUG3mOYyQ=' 'sha256-q/lDIwpAIeYF/vwTmBdQTJ907dQ7Gx6ZhAfm1WkhFRw=' 'sha256-qYNNoyarqSaFSuhfx8Lk9BeyWV9m8nxvH7QcTVwO6Ns=' 'sha256-U17JNxh6ZveonVSx4YSAJWEz+2a3DeZImCqQOvVGfgk=' 'sha256-u7y0wEJXNxDpSaJ0qLl/zyxJ+y3teBfQYbrv469AXtE=' 'sha256-o7E+WSRA0J7LB3xOuSnFhfQh/QhtXDkmpWxsEfZ6zkI='";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' $print_style_sources" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $oauth_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
      default_type application/json;
      return 200 '{"service":"crm-silmer-edge-web","status":"ok"}\n';
    }

    # Even nginx error diagnostics can include the original request/query.
    # OAuth exchange/auth failures remain observable through the API/audit.
    location = /melhor-envio {
      access_log off;
      error_log /dev/null;
      try_files /index.html =404;
    }

    # OLIST-T04: the authorization code must also stay out of error diagnostics.
    location = /olist {
      access_log off;
      error_log /dev/null;
      try_files /index.html =404;
    }

    location = /api/v1/events {
      resolver 127.0.0.11 valid=10s;
      set $api_upstream http://silmer-api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      add_header X-Accel-Buffering no;
    }

    # ADR 023: an art file upload carries up to 10 MB plus its thumbnail;
    # every other API body keeps the 1 MB default.
    location ~ ^/api/v1/orders/[^/]+/files$ {
      client_max_body_size 11m;
      resolver 127.0.0.11 valid=10s;
      set $api_upstream http://silmer-api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    # MED-01/02/03: chat media carries up to 16 MiB plus multipart metadata.
    # Keep the larger budget restricted to the exact upload collection.
    location ~ ^/api/v1/conversations/[^/]+/media$ {
      client_max_body_size 17m;
      resolver 127.0.0.11 valid=10s;
      set $api_upstream http://silmer-api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    # INBOX-AUDIO-01: n8n persists inbound audio up to 16 MiB plus multipart.
    # Authentication and attachment validation remain in the API.
    location ~ ^/api/v1/integrations/n8n/conversations/[^/]+/attachments$ {
      client_max_body_size 17m;
      resolver 127.0.0.11 valid=10s;
      set $api_upstream http://silmer-api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      limit_except POST { deny all; }
    }

    location /api/ {
      resolver 127.0.0.11 valid=10s;
      set $api_upstream http://silmer-api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location ^~ /assets/ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
