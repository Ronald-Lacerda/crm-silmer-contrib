          ordersHasMore,
          links,
          needsSubjectMessageIds,
        ]
      properties:
        currentSubjectId: { type: [string, 'null'] }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/ConversationSubject' }
        orders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, number, status]
            properties:
              id: { type: string }
              number: { type: string }
              status: { $ref: '#/components/schemas/OrderStatus' }
        ordersHasMore: { type: boolean }
        links:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [messageId, subjectId, assignedByKind]
