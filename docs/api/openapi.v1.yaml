        colors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [locationId, values]
            properties:
              locationId: { type: string, minLength: 1 }
              values:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
    DealLogisticsFields:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        desiredDate: { type: string, format: date }
        purpose: { type: string, minLength: 1 }
        purchaseProfile: { type: string, minLength: 1 }
        mode: { type: string, enum: [delivery, pickup] }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        pickupLocation: { type: string, minLength: 1 }
    FieldAssessment:
      type: object
      additionalProperties: false
      required: [field, status]
      properties:
        field: { type: string, minLength: 1 }
        status:
          {
            type: string,
            enum: [preenchido, nao_aplicavel, pendente, divergente],
          }
        reason: { type: string, minLength: 1 }
    DealFieldsPatchResponse:
      type: object
      additionalProperties: false
      required: [deal, readiness, totalQuantity]
      properties:
        deal:
          { $ref: '#/components/schemas/DealCommandResponse/properties/deal' }
        readiness:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [complete, blockers]
            properties:
              complete: { type: boolean }
              blockers: { type: array, items: { type: string } }
              nextPendingField: { type: string }
        totalQuantity:
          type: integer
          minimum: 0
          description: Soma derivada das quantidades estimadas de todos os itens.
    DealCommandResponse:
      type: object
      additionalProperties: false
      required: [deal]
      properties:
        deal:
          type: object
          additionalProperties: true
          required: [id, stage, status, version]
          properties:
            id: { type: string }
            stage:
              type: string
              enum: [produto, especificacao, estampa, logistica, fechamento]
            status: { type: string, enum: [active, lost] }
            version: { type: integer, minimum: 2 }
        gate:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [dealId, fromStage, version, blockers, evaluatedAt]
              properties:
                dealId: { type: string }
                fromStage:
                  type: string
                  enum: [produto, especificacao, estampa, logistica]
                version: { type: integer, minimum: 1 }
                blockers:
                  type: array
                  maxItems: 0
                evaluatedAt: { type: string, format: date-time }
    DealAssignmentRequest:
      type: object
      additionalProperties: false
      required: [assignedUserId, expectedDealVersion, reasonCode]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [manual_assignment] }
    TaskCreateRequest:
      type: object
      additionalProperties: false
      required:
        [assignedUserId, dueAt, expectedDealVersion, reasonCode, text, type]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        dueAt: { type: string, format: date-time }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [manual_follow_up] }
        text: { type: string, minLength: 1, maxLength: 4096 }
        type: { type: string, const: follow_up }
    TaskActionRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion, reasonCode]
      properties:
        expectedTaskVersion: { type: integer, minimum: 1 }
        reasonCode:
          { type: string, enum: [task_started, task_completed, task_cancelled] }
    HandoffCreateRequest:
      type: object
      additionalProperties: false
      required:
        [
          assignedUserId,
          conversationId,
          expectedConversationVersion,
          expectedDealVersion,
          reasonCode,
          summary,
        ]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        conversationId: { type: string, minLength: 1 }
        expectedConversationVersion: { type: integer, minimum: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum:
            [
              customer_requested_human,
              price_before_quote,
              unresolved_blocker,
              low_confidence,
            ]
        summary: { type: string, minLength: 1, maxLength: 8192 }
        automationEpoch: { type: integer, minimum: 0 }
        automationContext:
          type: object
          additionalProperties: false
          required: [executionId, workflowKey, workflowVersion]
          properties:
            executionId: { type: string, minLength: 1 }
            workflowKey: { type: string, minLength: 1 }
            workflowVersion: { type: string, minLength: 1 }
    HandoffActionRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedConversationVersion,
          expectedDealVersion,
          expectedHandoffVersion,
          expectedTaskVersion,
          reasonCode,
        ]
      properties:
        assignedUserId:
          type: string
          minLength: 1
          description: Obrigatório somente em transfer.
        expectedConversationVersion: { type: integer, minimum: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        expectedHandoffVersion: { type: integer, minimum: 1 }
        expectedTaskVersion: { type: integer, minimum: 1 }
        reasonCode:
          {
            type: string,
            enum: [handoff_accepted, manual_transfer, handoff_resolved],
          }
    OrderStatus:
      type: string
      enum: [pendente, confirmado]
    PaymentCondition:
      type: string
      enum: [pix, cartao_credito, cartao_debito]
    OrderSection:
      type: string
      enum: [summary, items, observations, artwork]
    OrderActorRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    FichaGradeLine:
      type: object
      additionalProperties: false
      required: [tamanho, quantidade]
      properties:
        tamanho: { type: string, minLength: 1 }
        quantidade: { type: integer, minimum: 1 }
    FichaItem:
      type: object
      additionalProperties: false
      description: >-
        Item da ficha (ADRs 016, 020 e 022). Principais, na ordem da tela: tipo
        (Tipo de roupa), cor, quantidade (soma da grade; nunca enviada),
        tipo_servico (Técnica: silk, DTF, sublimação, bordado… ou Sem
        estampa), malhas (Modelo de malha), grade (Tamanhos) e gola (Gola).
        Opcionais e sem bloquear (ADR 025): publico (masculino, feminino,
        infantil, unissex ou vazio) e quantidade_informada (referência do que
        o cliente disse; não entra no total). O bot pode
        preencher uma técnica vazia; é obrigatória para confirmar, mas pode
        ficar vazia enquanto pendente. Adicionais, que não bloqueiam: estampa
        (Estampa (referência)), cores do tecido por parte e vies_mangas; modelo
        e vies_gola são legados. Mangas e viés aceitam NAO APLICAVEL. Um item pode ser
        salvo incompleto (malhas e grade vazias, textos em branco). O servidor
        devolve todos os campos de texto, com vazio para os omitidos. Textos
        com até 200 caracteres; até 50 itens.
      required: [tipo, malhas, grade]
      properties:
        tipo: { type: string, maxLength: 200 }
        tipo_servico: { type: string, maxLength: 200 }
        cor: { type: string, maxLength: 200 }
        estampa: { type: string, maxLength: 200 }
        malhas:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        grade:
          type: array
          items: { $ref: '#/components/schemas/FichaGradeLine' }
        gola: { type: string, maxLength: 200 }
        modelo: { type: string, maxLength: 200 }
        cor_frente: { type: string, maxLength: 200 }
        cor_costas: { type: string, maxLength: 200 }
        cor_manga_direita: { type: string, maxLength: 200 }
        cor_manga_esquerda: { type: string, maxLength: 200 }
        vies_gola: { type: string, maxLength: 200 }
        vies_mangas: { type: string, maxLength: 200 }
        publico:
          type: string
          enum: ['', masculino, feminino, infantil, unissex]
        quantidade_informada:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
    FichaArtwork:
      type: object
      additionalProperties: false
      description: >-
        Quem faz a arte do pedido (ADR 020): o cliente envia, a Silmer cria
        (podem coexistir) ou sem estampa (exclusivo). Confirmar exige uma
        marcação. O bot preenche quando o pedido ainda não tem marcação; o
        vendedor corrige. O armazenamento dos arquivos está preparado, sem
        upload ativo; files permanece vazio até haver storage durável.
      required: [feito_pelo_cliente, feito_pela_silmer, sem_estampa, files]
      properties:
        feito_pelo_cliente: { type: boolean }
        feito_pela_silmer: { type: boolean }
        sem_estampa: { type: boolean }
        files:
          type: array
          readOnly: true
          maxItems: 0
          items: { type: object }
    FichaArtworkInput:
      type: object
      additionalProperties: false
      description: >-
        Quem faz a arte, marcado pelo vendedor. Não aceita arquivos ou
        metadados de arquivo. feito_pelo_cliente e feito_pela_silmer são
        exigidos e podem coincidir; sem_estampa é opcional (falso quando
        omitido) e recusado junto de uma das outras com 400.
      required: [feito_pelo_cliente, feito_pela_silmer]
      properties:
        feito_pelo_cliente: { type: boolean }
        feito_pela_silmer: { type: boolean }
        sem_estampa: { type: boolean }
    FichaSummary:
      type: object
      additionalProperties: false
      required: [cliente, data_entrega_confirmada, aplicacao, nome]
      properties:
        cliente:
          type: string
          readOnly: true
          description: Vem do contato da conversa e não é editável no pedido.
        data_entrega_confirmada: { type: [string, 'null'] }
        aplicacao:
          type: [string, 'null']
          description: >-
            Técnica geral legada (ADR 020); não é mais escrita, editada nem
            impressa a partir da v5. A técnica fica em cada item.
        nome: { type: [string, 'null'] }
    FichaSummaryInput:
      type: object
      additionalProperties: false
      description: >-
        Resumo editável; o cliente vem do contato e não é enviado. aplicacao
        de uma tela antiga é aceita e ignorada (ADR 020).
      required: [data_entrega_confirmada, nome]
      properties:
        data_entrega_confirmada: { type: [string, 'null'] }
        aplicacao: { type: [string, 'null'], deprecated: true }
        nome: { type: [string, 'null'] }
    FichaObservations:
      type: array
      maxItems: 5
      items: { type: string }
    Ficha:
      type: object
      additionalProperties: false
      required: [summary, items, observations, artwork, serviceData]
      properties:
        loja:
          $ref: '#/components/schemas/StoreFicha'
        summary: { $ref: '#/components/schemas/FichaSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/FichaItem' }
        observations: { $ref: '#/components/schemas/FichaObservations' }
        artwork: { $ref: '#/components/schemas/FichaArtwork' }
        serviceData:
          type: object
          additionalProperties: true
          readOnly: true
          description: >-
            Dados do atendimento vindos da pré-ficha (arte, locais, logística,
            finalidade, perfil de compra). Só leitura; não saem na ficha
            impressa.
    Order:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          conversationId,
          status,
          fabCode,
          ficha,
          totalPieces,
          missingFields,
          lastMessage,
          finalAmountCents,
          paymentCondition,
          orderDate,
          confirmedAt,
          confirmedBy,
          reopenedAt,
          reopenedBy,
          firstContactAt,
          paidOn,
          deliveredOn,
          seller,
          version,
          createdAt,
          updatedAt,
          origin,
          isTest,
          locked,
          storeNumber,
          leadTimeBusinessDays,
          gatewayPayment,
          fichaFirstPrintedAt,
          fichaFirstPrintedBy,
        ]
      properties:
        id: { type: string }
        number: { type: string, pattern: '^[0-9]{2,}-CRM$' }
        conversationId:
          type: [string, 'null']
          description: Nulo em pedidos manuais de atendimento e da loja do site.
        origin: { $ref: '#/components/schemas/OrderOrigin' }
        isTest:
          type: boolean
          description: >-
            Pedido da loja recebido com `teste: true`; fica fora do Dashboard.
        locked:
          type: boolean
          description: >-
            Pedido da loja: nenhuma escrita é aceita (409 ORDER_LOCKED).
        storeNumber:
          type: [string, 'null']
          pattern: '^LJ-[0-9A-F]{8}$'
          description: >-
            Pedido da loja (ADR 028): LJ- e os 8 primeiros hexadecimais do
            pedido_id do site.
        leadTimeBusinessDays:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Pedido da loja: prazo da cor em dias úteis (0 é pronta entrega).
        gatewayPayment:
          oneOf:
            - { $ref: '#/components/schemas/GatewayPayment' }
            - { type: 'null' }
        fichaFirstPrintedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Pedido da loja (ADRs 031 e 036): quando uma pessoa imprimiu o HTML
            ou gerou o PDF da ficha pela primeira vez. Nulo enquanto ninguém
            acessou a ficha e em todo pedido do atendimento.
        fichaFirstPrintedBy:
          description: Quem acessou a ficha pela primeira vez (ADRs 031 e 036).
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        fabCode: { type: string }
        ficha: { $ref: '#/components/schemas/Ficha' }
        totalPieces: { type: integer, minimum: 0 }
        missingFields:
          type: array
          description: >-
            O que ainda impede gerar o pedido pendente (ADRs 016 e 020),
            nesta ordem: items (nenhum item); items[N].tipo, items[N].cor,
            items[N].tipo_servico (técnica), items[N].malhas, items[N].grade e
            items[N].gola (ponto principal que falta no item N, a partir de 0;
            a grade vale também pela quantidade); artwork (ninguém marcou
            quem faz a arte nem sem estampa);
            summary.data_entrega_confirmada (entrega prometida ausente ou fora
            do formato AAAA-MM-DD); finalAmount; e paymentCondition. Vazio em
            pedido confirmado. Os adicionais do item, o resto do resumo e as
            outras datas do lastro (paidOn, deliveredOn) nunca aparecem aqui:
            por enquanto, gerar subentende o pagamento feito.
          items: { type: string }
        lastMessage:
          description: >-
            Metadados da última mensagem da conversa, sem conteúdo ou dados
            do contato. Nulo quando a conversa ainda não tem mensagens.
          oneOf:
            - { $ref: '#/components/schemas/OrderLastMessage' }
            - { type: 'null' }
        finalAmountCents: { type: [integer, 'null'], minimum: 1 }
        paymentCondition:
          oneOf:
            - { $ref: '#/components/schemas/PaymentCondition' }
            - { type: 'null' }
        orderDate: { type: [string, 'null'], format: date }
        confirmedAt: { type: [string, 'null'], format: date-time }
        confirmedBy:
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        reopenedAt: { type: [string, 'null'], format: date-time }
        reopenedBy:
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        firstContactAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Primeiro contato: abertura da conversa que originou o pedido,
            copiada na criação. Nulo só em pedido criado durante a troca de
            versão da API.
        paidOn:
          type: [string, 'null']
          format: date
          description: >-
            Dia de recebimento integral, informado por uma pessoa; no pedido da loja, o
            dia (São Paulo) em que a InfinitePay confirmou o Pix.
        paymentReviewRequired:
          type: boolean
          description: Data manual legada fora do Financeiro até declaração explícita de quitação integral.
        deliveredOn:
          type: [string, 'null']
          format: date
          description: Dia da entrega realizada, informado por uma pessoa.
        seller:
          description: Dono atual da conversa.
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderLastMessage:
      type: object
      additionalProperties: false
      required: [direction, occurredAt, deliveryStatus, status]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        occurredAt: { type: string, format: date-time }
        deliveryStatus: { type: [string, 'null'] }
        status: { type: string }
    OrdersSummary:
      type: object
      additionalProperties: false
      required:
        [
          confirmedCount,
          soldAmountCents,
          averageTicketCents,
          pendingCount,
          totalPiecesSold,
          storeNewCount,
          storeNewOldestPaidAt,
          period,
          deliveries,
          today,
        ]
      properties:
        confirmedCount: { type: integer, minimum: 0 }
        soldAmountCents: { type: integer, minimum: 0 }
        averageTicketCents: { type: integer, minimum: 0 }
        pendingCount: { type: integer, minimum: 0 }
        totalPiecesSold: { type: integer, minimum: 0 }
        storeNewCount:
          type: integer
          minimum: 0
          description: >-
            Pedidos novos do site (ADR 031): da loja, sem teste, com a ficha
            nunca impressa.
        storeNewOldestPaidAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Instante em que a InfinitePay confirmou o Pix do pedido novo do
            site mais antigo; nulo sem pedido novo.
        today: { type: string, format: date, description: Dia de São Paulo. }
        period:
          type: object
          additionalProperties: false
          required: [key, from, to, timeZone, confirmedCount, soldAmountCents]
          properties:
            key: { type: string, enum: [hoje, 7dias, mes] }
            from: { type: string, format: date }
            to: { type: string, format: date }
            timeZone: { type: string, const: America/Sao_Paulo }
            confirmedCount: { type: integer, minimum: 0 }
            soldAmountCents: { type: integer, minimum: 0 }
        deliveries:
          type: object
          additionalProperties: false
          required: [overdueCount, oldestOverdueOn, dueSoonCount, dueSoonUntil]
          properties:
            overdueCount: { type: integer, minimum: 0 }
            oldestOverdueOn: { type: [string, 'null'], format: date }
            dueSoonCount: { type: integer, minimum: 0 }
            dueSoonUntil: { type: string, format: date }
    InboxSummary:
      type: object
      additionalProperties: false
      required: [generatedAt, waitingHandoff, mine, assistant]
      properties:
        generatedAt: { type: string, format: date-time }
        waitingHandoff:
          type: object
          additionalProperties: false
          required: [count, overdueCount, oldestSince]
          properties:
            count: { type: integer, minimum: 0 }
            overdueCount:
              type: integer
              minimum: 0
              description: Handoffs pendentes além do `due_at` do próprio SLA.
            oldestSince: { type: [string, 'null'], format: date-time }
        mine:
          type: object
          additionalProperties: false
          required:
            [count, awaitingReplyCount, oldestAwaitingSince, pendingOrderCount]
          properties:
            count: { type: integer, minimum: 0 }
            pendingOrderCount:
              type: integer
              minimum: 0
              description: >-
                Pedidos pendentes do leitor: manuais de que é dono ou de
                conversas atribuídas a ele; teste fica fora.
            awaitingReplyCount:
              type: integer
              minimum: 0
              description: Conversas do leitor cuja última mensagem é do cliente.
            oldestAwaitingSince: { type: [string, 'null'], format: date-time }
        assistant:
          type: object
          additionalProperties: false
          required:
            [
              activeCount,
              stalledCount,
              stallMinutes,
              failedDeliveryCount,
              lastReplyAt,
            ]
          properties:
            activeCount: { type: integer, minimum: 0 }
            stalledCount:
              type: integer
              minimum: 0
              description: >-
                Conversas com o assistente cuja mensagem do cliente está sem
                resposta há `stallMinutes` ou mais.
            stallMinutes: { type: integer, minimum: 1 }
            failedDeliveryCount:
              type: integer
              minimum: 0
              description: Conversas com envio falho ou incerto nas últimas 24 h.
            lastReplyAt: { type: [string, 'null'], format: date-time }
    OrderFile:
      type: object
      additionalProperties: false
      required:
        [
          id,
          slot,
          name,
          extension,
          contentType,
          sizeBytes,
          thumbnail,
          uploadedAt,
          uploadedBy,
        ]
      properties:
        id: { type: string }
        slot: { type: string, enum: [reference, final] }
        name:
          type: string
          maxLength: 120
          description: Nome original sem caminho; guardado cifrado.
        extension:
          type: string
          enum:
            [
              ai,
              cdr,
              eps,
              jpeg,
              jpg,
              pdf,
              png,
              psd,
              rar,
              svg,
              tif,
              tiff,
              webp,
              zip,
            ]
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        thumbnail:
          type: boolean
          description: Há miniatura WebP em /thumbnail.
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { $ref: '#/components/schemas/OrderActorRef' }
    OrderFiles:
      type: object
      additionalProperties: false
      required: [final, references, limits]
      properties:
        final:
          oneOf:
            - $ref: '#/components/schemas/OrderFile'
            - type: 'null'
        references:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/OrderFile' }
        limits:
          type: object
          additionalProperties: false
          required: [maxBytes, maxReferences]
          properties:
            maxBytes: { type: integer, const: 10485760 }
            maxReferences: { type: integer, const: 5 }
    OrderFileUpload:
      type: object
      additionalProperties: false
      required: [slot, file]
      properties:
        slot: { type: string, enum: [reference, final] }
        file: { type: string, format: binary, description: Até 10 MB. }
        thumbnail:
          type: string
          format: binary
          description: WebP de até 256 KB, só para PNG, JPEG e WebP.
    OrderResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }
    ConversationOrderResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          oneOf:
            - { $ref: '#/components/schemas/Order' }
            - { type: 'null' }
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        nextCursor: { type: [string, 'null'] }
        counts:
          type: object
          additionalProperties: false
          required: [pendente, confirmado]
          properties:
            pendente: { type: integer, minimum: 0 }
            confirmado: { type: integer, minimum: 0 }
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual da conversa.
    ManualOrderCreateRequest:
      type: object
      additionalProperties: false
      required: [contactId]
      properties:
        contactId: { type: string, minLength: 1, maxLength: 128 }
    OrderSectionPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, value]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        value:
          description: >-
            Seção inteira: FichaSummaryInput para summary, lista de FichaItem
            para items, FichaObservations para observations ou
            FichaArtworkInput para artwork. Arquivos não são aceitos.
          oneOf:
            - { $ref: '#/components/schemas/FichaSummaryInput' }
            - type: array
              items: { $ref: '#/components/schemas/FichaItem' }
            - { $ref: '#/components/schemas/FichaObservations' }
            - { $ref: '#/components/schemas/FichaArtworkInput' }
    OrderConfirmRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, amountText, paymentCondition]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        amountText:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            Valor final em reais no formato brasileiro, sem o prefixo R$ (ex.:
            4.820,00). Armazenado em centavos inteiros maiores que zero.
        paymentCondition: { $ref: '#/components/schemas/PaymentCondition' }
    OrderReopenRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
    OrderMilestonesRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, paidOn]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        paidOn: { type: [string, 'null'], format: date }
        paymentReviewed:
          type: boolean
          description: Declaração explícita de quitação integral que libera data manual legada, mesmo se inalterada.
        deliveredOn:
          type: [string, 'null']
          format: date
          description: Obrigatório para pedido com conversa; proibido para manual sem conversa.
    OrderOrigin:
      type: string
      enum: [atendimento, loja]
    StoreFicha:
      type: object
      additionalProperties: false
      readOnly: true
      required: [telefone, produto, comprovanteUrl]
      description: >-
        Pedido da loja do site (ADRs 027 e 028): o que o registro trouxe além
        do item e do cliente. Fica dentro da ficha cifrada.
      properties:
        telefone: { type: string, description: E.164 brasileiro sem "+". }
        produto:
          type: object
          additionalProperties: false
          required: [slug, nome]
          properties:
            slug: { type: string }
            nome: { type: string }
        comprovanteUrl:
          type: [string, 'null']
          format: uri
          description: Link do comprovante da InfinitePay, quando houver.
    GatewayPayment:
      type: object
      additionalProperties: false
      readOnly: true
      required:
        [
          source,
          confirmedAt,
          paidAmountCents,
          transactionNsu,
          invoiceSlug,
          receiptUrl,
        ]
      description: >-
        Pedido da loja (ADR 028): o pagamento que a InfinitePay confirmou.
      properties:
        source: { type: string, const: infinitepay }
        confirmedAt: { type: string, format: date-time }
        paidAmountCents: { type: integer, minimum: 1 }
        transactionNsu: { type: string }
        invoiceSlug: { type: string }
        receiptUrl: { type: [string, 'null'], format: uri }
    StoreOrderRecord:
      type: object
      additionalProperties: false
      description: >-
        ADR 028: o pedido pago que o workflow n8n da loja registra depois do
        payment_check. Todas as chaves listadas em required são obrigatórias;
        entrega é opcional para envio. Nenhuma outra chave é aceita
        (UNKNOWN_REQUEST_FIELD).
      required:
        [
          schema_version,
          pedido_id,
          numero_loja,
          teste,
          produto,
          item,
          valor_centavos,
          cliente,
          pagamento,
        ]
      properties:
        schema_version: { type: string, const: '1.0' }
        pedido_id:
          type: string
          format: uuid
          description: UUID v4 gerado pelo site; é o order_nsu da InfinitePay.
        numero_loja:
          type: string
          pattern: '^LJ-[0-9A-F]{8}$'
          description: LJ- e os 8 primeiros hexadecimais de pedido_id, em maiúsculas.
        teste:
          type: boolean
          description: >-
            Aceito só com STORE_ORDERS_ACCEPT_TEST=true (senão 422
            TEST_REFUSED); o pedido fica fora do Dashboard.
        produto:
          type: object
          additionalProperties: false
          required: [slug]
          properties:
            slug: { type: string, example: camisa-masculina-lisa }
        item:
          type: object
          additionalProperties: false
          required: [cor_id, tamanho_id, quantidade, prazo_dias]
          properties:
            cor_id: { type: string, enum: [branca, chumbo, preta] }
            tamanho_id:
              { type: string, enum: [pp, p, m, g, gg, eg, xg, xx, jeg] }
            quantidade: { type: integer, const: 10 }
            prazo_dias:
              type: integer
              description: Dias úteis da cor — branca 0, chumbo e preta 10.
        valor_centavos:
          type: integer
          description: >-
            18000; 100 só num pedido de teste aceito. Conferido com o catálogo
            do CRM, que grava o próprio preço.
        cliente:
          type: object
          additionalProperties: false
          required: [nome, telefone]
          properties:
            nome: { type: string, minLength: 2, maxLength: 80 }
            telefone:
              type: string
              pattern: '^55[1-9]{2}(?:9[0-9]{8}|[2-5][0-9]{7})$'
              description: E.164 brasileiro sem "+".
        entrega:
          type: object
          additionalProperties: false
          description: >-
            Somente para envio. O CRM grava o CEP e a instrução de contato em
            Observações do pedido. Omitir para retirada na loja.
          required: [tipo, cep]
          properties:
            tipo: { type: string, const: envio }
            cep: { type: string, pattern: '^(?!00000-000$)[0-9]{5}-[0-9]{3}$' }
        pagamento:
          type: object
          additionalProperties: false
          required:
            [
              gateway,
              forma,
              transaction_nsu,
              invoice_slug,
              valor_pago_centavos,
              pago_em,
              receipt_url,
            ]
          properties:
            gateway: { type: string, const: infinitepay }
            forma: { type: string, const: pix }
            transaction_nsu: { type: string, pattern: '^[\x21-\x7e]{1,128}$' }
            invoice_slug: { type: string, pattern: '^[\x21-\x7e]{1,128}$' }
            valor_pago_centavos:
              type: integer
              minimum: 1
              description: Maior ou igual a valor_centavos (senão 422 AMOUNT_BELOW_PRICE).
            pago_em:
              type: string
              format: date-time
              description: >-
                ISO 8601 em UTC (sufixo Z), no máximo 5 minutos à frente do
                relógio do CRM e 30 dias atrás.
            receipt_url:
              type: [string, 'null']
              format: uri
              description: >-
                Nulo, ou https em infinitepay.io, *.infinitepay.io,
                infinitepay.com.br ou *.infinitepay.com.br, sem porta nem
                credencial.
    StoreOrderRecorded:
      type: object
      additionalProperties: false
      required:
        [
          numero,
          numero_loja,
          pedido_id,
          criado,
          comprovante_registrado,
          pedido_url,
          ficha_url,
        ]
      properties:
        numero: { type: string, pattern: '^[0-9]{2,}-CRM$' }
        numero_loja: { type: string, pattern: '^LJ-[0-9A-F]{8}$' }
        pedido_id:
          type: string
          description: Id do pedido no CRM (não é o pedido_id do site).
        criado: { type: boolean }
        comprovante_registrado: { type: boolean }
        pedido_url:
          type: string
          description: APP_BASE_URL + /pedidos/{id}; relativa sem APP_BASE_URL.
        ficha_url:
          type: string
          description: >-
            APP_BASE_URL + /api/v1/orders/{id}/print?download=1; exige sessão
            do CRM.
    OrderError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum:
                [
                  ORDER_NOT_FOUND,
                  VERSION_CONFLICT,
                  ORDER_NOT_CONFIRMED,
                  ORDER_NOT_CONFIRMABLE,
                  INVALID_AMOUNT,
                  INVALID_GRADE,
                  INVALID_DATE,
                  ORDER_STATUS_CONFLICT,
                  EMPTY_FILE,
                  FILE_CONTENT_MISMATCH,
                  FILE_LIMIT_REACHED,
                  FILE_NOT_FOUND,
                  FILE_TOO_LARGE,
                  FILE_TYPE_NOT_ALLOWED,
                  INVALID_FILE_NAME,
                  INVALID_FILE_SLOT,
                  INVALID_THUMBNAIL,
                  ORDER_LOCKED,
                ]
            fields:
              type: array
              description: >-
                Campos recusados em ORDER_NOT_CONFIRMABLE (as chaves de
                Order.missingFields) e INVALID_DATE.
              items: { type: string }
            index:
              type: integer
              minimum: 0
              description: Índice da linha recusada em INVALID_GRADE.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string }
  responses:
    N8nProblem:
      description: Erro compatível em application/problem+json sem eco de PII
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/N8nProblem' }
    InvalidRequest:
      description: Entrada inválida sem eco de dados recebidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: Credenciais inválidas, sem indicar se a conta existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Origem, CSRF, sessão ou autorização inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Pessoa alvo da mudança de capacidade não encontrada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Chave idempotente divergente ou bootstrap já consumido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Throttled:
      description: Bloqueio progressivo ativo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Dependência de autenticação ou persistência indisponível
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OrderNotFound:
      description: Pedido inexistente (ORDER_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderError' }
    OrderConflict:
      description: >-
        Versão desatualizada (VERSION_CONFLICT), impressão de pedido pendente
        (ORDER_NOT_CONFIRMED), edição ou reabertura fora do status permitido
        ou chave idempotente divergente
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/OrderError' }
              - { $ref: '#/components/schemas/Error' }
    OrderUnprocessable:
      description: >-
        Pedido não confirmável (ORDER_NOT_CONFIRMABLE com fields), valor em
        formato inválido (INVALID_AMOUNT), grade inválida (INVALID_GRADE com
        index) ou data inválida ou futura (INVALID_DATE com fields)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderError' }
