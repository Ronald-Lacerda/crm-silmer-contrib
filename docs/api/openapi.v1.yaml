openapi: 3.1.0
info:
  title: CRM Silmer API
  version: 1.0.0
  description: Contratos versionados de identidade e domínio do CRM Silmer.
servers:
  - url: /api/v1
paths:
  /inbox/conversations/{conversationId}/order-assistance:
    get:
      operationId: readConversationOrderAssistance
      summary: Sugestões internas e decisões de abertura de pedido
      description: OA-01–12 / ADR 056. Leitura autorizada; conteúdo mínimo cifrado no CRM.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Sugestões, decisões humanas em evaluations, analysisHistory, versões e blockedReason
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Conversa não encontrada }
  /inbox/conversations/{conversationId}/order-assistance/decisions:
    post:
      operationId: decideOrderAssistance
      summary: Criar pedido após confirmação do cliente, adiar, recusar ou marcar omissão
      description: >-
        Responsável humano ou administrador. Decisão, criação pendente e
        auditoria na mesma transação. Nenhum envio ao cliente. Revisões,
        epoch e alvo são revalidados; retry da chave não duplica pedido.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason, expectedConversationVersion, expectedSourceRevision]
              properties:
                decision: { enum: [accept, defer, reject, missed] }
                reason: { enum: [ready, not_ready, withdrawn, unsupported, wrong_product, other] }
                suggestionId: { type: string }
                sourceMessageId: { type: string, description: Mensagem cliente exigida para missed }
                expectedVersion: { type: integer, minimum: 0, description: Versão da sugestão; exigida salvo missed }
                expectedConversationVersion: { type: integer, minimum: 0 }
                expectedSourceRevision: { type: integer, minimum: 0 }
      responses:
        '200': { description: Decisão persistida e pedido pendente quando aceito }
        '400': { description: Comando ou evidência inválidos }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/order-assistance/metrics:
    get:
      operationId: readOrderAssistanceMetrics
      summary: Avaliação administrativa das sugestões e omissões anotadas
      description: Agregados sem PII; criação manual sem sugestão não equivale a omissão comprovada.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200': { description: Contagens de análise, falhas, sugestões, decisões, omissões e tempos }
        '403': { $ref: '#/components/responses/Forbidden' }
  /conversations/{conversationId}/shipping-quotes:
    post:
      operationId: quoteConversationShipping
      summary: Consulta frete para Assunto e Pedido explícitos no atendimento humano
      description: >-
        T139 / MEVQ-01–08. Apenas responsável humano ativo ou administrador.
        Confere vínculo e versão antes e depois do cálculo. Peso e medidas são
        explícitos; não muda total/status nem compra ou envia. Replays usam a
        mesma chave e revalidam o acesso. Dados persistidos são cifrados.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  subjectId,
                  orderId,
                  orderVersion,
                  fromPostalCode,
                  toPostalCode,
                  weightGrams,
                  widthCm,
                  heightCm,
                  lengthCm,
                  insuranceValueCents,
                ]
              properties:
                subjectId: { type: string }
                orderId: { type: string }
                orderVersion: { type: integer, minimum: 1 }
                fromPostalCode: { type: string }
                toPostalCode: { type: string }
                weightGrams: { type: integer, minimum: 1 }
                widthCm: { type: integer, minimum: 1 }
                heightCm: { type: integer, minimum: 1 }
                lengthCm: { type: integer, minimum: 1 }
                insuranceValueCents: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Resultado do provedor cifrado e vinculado ao alvo; selecionar serviço separadamente
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/ConversationShippingQuoteResponse',
                }
        '400': { description: Entrada ou chave idempotente inválida }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Conversa ou pedido não encontrado }
        '409':
          {
            description: Alvo/versão mudou,
            atendimento não humano,
            replay divergente ou conexão exige reconexão,
          }
        '422': { description: Embalagem ou CEP inválido }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /conversations/{conversationId}/shipping-quotes/{quoteId}/select:
    post:
      operationId: selectConversationShippingService
      summary: Vincula um serviço retornado como frete estimado do pedido
      description: Aceita somente ID de serviço retornado pelo provedor; o navegador não define o preço.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - name: quoteId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectId, orderId, orderVersion, serviceId]
              properties:
                subjectId: { type: string }
                orderId: { type: string }
                orderVersion: { type: integer, minimum: 1 }
                serviceId: { type: integer }
      responses:
        '200':
          description: Estimativa selecionada com origem e instante, separada do valor comercial
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/ConversationShippingQuoteResponse',
                }
        '400': { description: Entrada ou chave idempotente inválida }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Alvo ou cotação não encontrado }
        '409':
          { description: Alvo, versão ou seleção mudou; exige nova consulta }
        '422': { description: Serviço não pertence ao resultado }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/shipping-quote:
    get:
      operationId: readOrderShippingQuote
      summary: Consulta a estimativa selecionada com autorização de leitura do pedido
      security:
        - sessionCookie: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Última estimativa selecionada ou quote null; stale indica versão/consulta superada
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/ConversationShippingQuoteResponse',
                }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bootstrap/identity:
    post:
      operationId: bootstrapIdentity
      summary: Cria o único Admin inicial
      parameters:
        - $ref: '#/components/parameters/BootstrapToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Admin criado uma única vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users:
    get:
      operationId: listUsers
      summary: Lista todas as contas, inclusive as desativadas
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Contas do CRM
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      summary: Cria uma conta com perfil Vendedor, Financeiro ou Administrador
      description: >-
        A senha em claro nunca retorna no corpo da resposta; o bloco de
        entrega é montado no cliente a partir do que foi digitado.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    delete:
      operationId: deleteUser
      summary: Exclui permanentemente uma conta sem histórico operacional
      description: >-
        Contas com COMMERCIAL_ADMIN nunca podem ser excluídas. Se a conta tiver
        histórico operacional, a API responde 409 USER_HAS_HISTORY; nesse caso,
        a desativação é o caminho disponível.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Conta excluída ou replay idempotente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      operationId: updateUser
      summary: Altera nome, e-mail, senha ou perfil de uma conta
      description: >-
        Todo campo é opcional e pelo menos um deve vir. Um campo ausente
        permanece inalterado. Trocar a senha não revoga sessões abertas.
        Trocar accessType remove capacidades anteriores e revoga sessões.
        Admin não pode trocar seu próprio perfil; histórico é preservado.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}/{state}:
    post:
      operationId: setUserDisabled
      summary: Desativa ou reativa uma conta
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
        - name: state
          in: path
          required: true
          schema: { type: string, enum: [disable, enable] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Situação da conta alterada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions:
    post:
      operationId: createSession
      summary: Autentica sem enumerar contas e cria cookies separados
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada; nenhum token integra o corpo
          headers:
            Set-Cookie:
              description: crm_session HttpOnly e crm_csrf legível pelo cliente
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/Throttled' }
  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Retorna o usuário da sessão e toca a expiração ociosa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
    delete:
      operationId: deleteCurrentSession
      summary: Revoga a sessão atual
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': { description: Sessão revogada e cookies expirados }
        '403': { $ref: '#/components/responses/Forbidden' }
  /capabilities/{change}:
    post:
      operationId: changeCapability
      summary: Concede ou revoga capacidade e audita a mudança
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: change
          in: path
          required: true
          schema: { type: string, enum: [grant, revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequest'
      responses:
        '200':
          description: Mudança confirmada
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/conversations:
    get:
      operationId: listInboxConversations
      summary: Lista o backlog operacional de conversas
      description: >-
        Projeção paginada e minimizada. Cursores são assinados e vinculados aos
        filtros para impedir troca silenciosa de escopo.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: state,
            in: query,
            schema: { $ref: '#/components/schemas/ConversationState' },
          }
        - {
            name: channel,
            in: query,
            schema: { $ref: '#/components/schemas/Channel' },
          }
        - {
            name: automationState,
            in: query,
            schema: { type: string, enum: [assistant, human] },
          }
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - name: unassignedHumanHandoff
          in: query
          schema: { type: boolean, default: false }
          description: >-
            Quando true, retorna somente conversas em modo humano com
            handoff pendente e sem responsável atribuído.
        - name: pendingHandoff
          in: query
          schema: { type: boolean }
          description: >-
            Estado "Aguardando vendedor". Quando true, retorna só conversas
            com handoff pendente, ordenadas pelo tempo parado (a espera mais
            antiga primeiro); quando false, só conversas sem handoff pendente.
            Combina com os demais filtros.
        - name: workQueue
          in: query
          schema: { type: string, enum: [attention, closing] }
          description: >-
            Fila pessoal vinculada ao ator da sessão. attention inclui handoff
            sem dono e ações humanas pendentes do próprio vendedor; closing
            inclui um pedido pendente não teste validado para revisão, com
            alvo explícito em reviewOrder, direto ou vinculado por Assunto.
            Exclui outros responsáveis e conversas terminais/arquivadas.
            Filtro, total e ordem por maior espera são aplicados antes de LIMIT;
            o cursor assinado também é vinculado ao ator.
        - {
            name: archived,
            in: query,
            schema: { type: boolean, default: false },
            description: 'Quando true, retorna somente conversas arquivadas.',
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de conversas, sem envelopes cifrados ou payload bruto
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/conversations/{conversationId}:
    get:
      operationId: getInboxConversation
      summary: Retorna uma conversa e seu histórico persistido
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Conversa, mensagens e sugestão pendente minimizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxConversationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inbox/conversations/{conversationId}/handoff:
    get:
      operationId: getInboxConversationHandoff
      summary: Retorna o handoff aberto da conversa com o resumo
      description: >-
        INBOX-HANDOFF-01 / AGT-03. Handoff pendente ou aceito da conversa, com
        o resumo que o agente gravou (Ficha, Atenção, Dica, perguntas do
        cliente). Exige handoff.read; o resumo é decifrado somente depois da
        autorização e a resposta é private, no-store. handoff é null quando a
        conversa não tem handoff aberto.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Handoff aberto da conversa, ou null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [handoff]
                properties:
                  handoff:
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required:
                          [id, status, version, reasonCode, summary, createdAt]
                        properties:
                          id: { type: string }
                          status: { type: string, enum: [pending, accepted] }
                          version: { type: integer, minimum: 1 }
                          reasonCode: { type: string }
                          summary: { type: string, maxLength: 8192 }
                          createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/conversations/{conversationId}/subjects:
    get:
      operationId: listConversationSubjects
      summary: Lista assuntos, vínculos de mensagens e pedidos do contato
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
        - name: order
          in: query
          required: false
          description: Trecho literal do número do pedido para filtrar os primeiros 100 resultados
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Assuntos da conversa e até 100 pedidos do contato filtrados por número
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSubjects' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createConversationSubject
      summary: Abre assunto sem pedido ou ligado a pedido do mesmo contato
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationSubject' }
      responses:
        '201':
          description: Assunto criado; atual só quando select não é false
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/conversations/{conversationId}/subjects/{subjectId}/select:
    post:
      operationId: selectConversationSubject
      summary: Define o assunto atual pela decisão do vendedor
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - {
            name: subjectId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: Seleção auditada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/conversations/{conversationId}/messages/{messageId}/subjects:
    put:
      operationId: assignMessageSubjects
      summary: Substitui os vínculos de assuntos de uma mensagem
      description: >-
        A decisão humana, inclusive lista vazia, substitui vínculos humanos ou
        do agente e resolve a revisão pendente da mensagem, sem resolver o
        handoff nem devolver a Conversa ao bot. Turnos posteriores do agente
        não sobrescrevem essa decisão.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - {
            name: messageId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectIds]
              properties:
                subjectIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string }
      responses:
        '200': { description: Vínculos auditados }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/summary:
    get:
      operationId: getInboxSummary
      summary: Retorna a fila do leitor e a saúde do atendimento
      description: >-
        Ação conversation.read. Contagens e instantes calculados no relógio do
        servidor, sem conteúdo de mensagem nem dado do contato: handoffs
        esperando vendedor (e os fora do SLA), as conversas abertas do próprio
        leitor e a saúde do assistente. Conversas arquivadas ou encerradas
        ficam fora. Não aceita parâmetros: a fila é sempre a da sessão.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Resumo da fila
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/handoffs:
    get:
      operationId: listOpenHandoffs
      summary: Lista handoffs humanos pendentes
      description: >-
        Projeção paginada e minimizada para a fila de atendimento. O resumo é
        decifrado somente depois da autorização do operador autenticado.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de handoffs pendentes, sem envelopes cifrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contacts:
    get:
      operationId: listContacts
      summary: Lista contatos canônicos e suas identidades por canal
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: q,
            in: query,
            description: Busca textual por nome. Telefones devem ser enviados em POST /contacts/search para não entrarem em URLs e logs.,
            schema: { type: string, minLength: 1, maxLength: 120 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de contatos, sem envelopes cifrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createManualContact
      summary: Cadastra cliente com telefone obrigatório sem vincular identidade de canal não verificada
      description: Ação contact.create. A mesma chave de idempotência retorna o contato original.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualContactCreateRequest' }
      responses:
        '200':
          description: Repetição idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCreateResponse' }
        '201':
          description: Cliente criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCreateResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /contacts/search:
    post:
      operationId: searchContactsPrivate
      summary: Busca interna de contatos por nome ou telefone completo
      description: Exige sessão humana, capacidade contact.read, Origin e CSRF. Números declarados no chat do site são candidatos não verificados; resultados duplicados exigem escolha humana. A resposta não pode ser armazenada em cache.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [q]
              properties:
                q: { type: string, minLength: 1, maxLength: 120 }
                cursor: { type: string, maxLength: 1024 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Página de candidatos, incluindo origem do telefone; não confirma identidade nem une contatos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Limite temporário de buscas privadas excedido }
  /contacts/{contactId}:
    get:
      operationId: getContact
      summary: Retorna contato, identidades e histórico associado
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Histórico operacional minimizado do contato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contacts/{contactId}/details:
    post:
      operationId: completeContactDetails
      summary: Completa telefone de cadastro legado antes de novo pedido manual
      description: Ação contact.rename. Telefone digitado não associa identidade de canal.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, expectedVersion]
              properties:
                phone: { type: string }
                email: { type: string, format: email, maxLength: 254 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Detalhes atualizados ou replay da mesma chave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCreateResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /contacts/{contactId}/registration:
    put:
      operationId: replaceContactRegistration
      summary: Substitui o cadastro completo opcional do contato (CP-25..27, ADR 047)
      description: >-
        Ação contact.rename. Substitui o cadastro inteiro; campos ausentes,
        nulos ou vazios ficam nulos. Exige versão esperada e Idempotency-Key:
        a mesma chave com o mesmo conteúdo devolve o mesmo resultado e com
        outro conteúdo responde 409 IDEMPOTENCY_KEY_REUSED. Os valores ficam
        cifrados; auditoria contact.registration.updated e evento de domínio
        carregam apenas o id do contato. Celular e e-mail seguem em
        /contacts/{contactId}/details.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/ContactRegistrationUpdateRequest' }
      responses:
        '200':
          description: Cadastro substituído ou replay da mesma chave
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/ContactRegistrationResponse' }
        '400':
          description: >-
            Corpo inválido (INVALID_REQUEST) ou primeiro campo inválido na
            ordem do formulário, com o nome do campo e sem eco do valor
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ContactRegistrationError' }
                  - { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Versão desatualizada (CONTACT_CONFLICT) ou chave idempotente reutilizada com outro conteúdo (IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /postal-codes/lookup:
    post:
      operationId: lookupPostalCode
      summary: Sugere endereço para um CEP consultando o ViaCEP pela API (CP-28, ADR 047)
      description: >-
        Ação contact.read com sessão, Origin e CSRF, como a busca privada de
        contatos. O CEP vai no corpo para não ficar em URLs nem em logs de
        acesso do proxy. Somente o CEP sai do CRM, com tempo limite de 3
        segundos. A sugestão é editável. CEP inexistente responde 404
        POSTAL_CODE_NOT_FOUND e falha, tempo esgotado ou resposta inesperada
        do ViaCEP responde 503 POSTAL_CODE_UNAVAILABLE; em ambos o
        preenchimento manual continua disponível.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [postalCode]
              properties:
                postalCode: { type: string, pattern: '^\d{5}-?\d{3}$' }
      responses:
        '200':
          description: Sugestão de endereço; campos vazios no ViaCEP vêm nulos
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostalCodeSuggestion' }
        '400':
          description: CEP fora do formato (INVALID_POSTAL_CODE) ou corpo inválido (INVALID_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: CEP inexistente (POSTAL_CODE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { description: Limite temporário de consultas de CEP excedido }
        '503':
          description: ViaCEP indisponível (POSTAL_CODE_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /events:
    get:
      operationId: streamInboxEvents
      summary: Reproduz eventos autorizados de atendimento e Pedidos em ordem durável
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: topic,
            in: query,
            required: false,
            schema: { type: string, const: inbox },
          }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - {
            name: Last-Event-ID,
            in: header,
            schema: { type: integer, minimum: 0 },
          }
      responses:
        '200':
          description: >-
            text/event-stream privado, sem cache. topic é opcional e aceita somente inbox.
            Emite inbox.contact.changed, inbox.conversation.changed,
            inbox.order.changed, identity.user.changed e stream.reset;
            session.expired encerra acesso revogado. Heartbeat a cada 15 segundos.
            Last-Event-ID tem precedência sobre after; cursor não negativo e inteiro seguro.
            Payloads minimizados não transportam PII, prompts ou segredos.
          content:
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Limite de aberturas por origem ou de streams simultâneos excedido
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /site-chat/messages:
    options:
      operationId: preflightSiteChatMessages
      summary: Preflight do widget do chat Silmer
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            {
              type: string,
              enum: [https://silmer.com.br, https://www.silmer.com.br],
            }
      responses:
        '204': { description: Origem permitida }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: readSiteChatMessages
      summary: Consulta mensagens de uma única sessão aleatória do chat do site
      description: >-
        O UUIDv4 da sessão é o segredo de acesso. Não consulta pelo telefone
        informado nem revela conversas de outras sessões. Retorna no máximo
        100 mensagens de texto recebidas ou enviadas, sem cache.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            {
              type: string,
              enum: [https://silmer.com.br, https://www.silmer.com.br],
            }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        '200':
          description: Mensagens dessa sessão, inclusive respostas humanas da caixa de entrada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, direction, sender, text, occurred_at]
                      properties:
                        id: { type: string, format: uuid }
                        direction: { type: string, enum: [inbound, outbound] }
                        sender: { type: string }
                        text: { type: string }
                        occurred_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Limite de consultas da sessão excedido }
  /integrations/n8n/messages/inbound:
    post:
      operationId: receiveN8nInboundMessage
      summary: Persiste uma mensagem recebida pelo n8n e devolve o contexto oficial
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/N8nInboundRequest' }
      responses:
        '200':
          description: Evento aceito ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/N8nInboundResponse' }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /integrations/n8n/conversations/{conversationId}/attachments:
    post:
      operationId: storeN8nAttachment
      summary: Valida em streaming, quarentena e publica uma mídia transitória segura
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/ContentSha256'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/N8nAttachmentRequest' }
      responses:
        '200': { description: Replay idempotente do anexo já publicado }
        '201': { description: Anexo verificado e publicado }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '413': { $ref: '#/components/responses/N8nProblem' }
        '415': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /integrations/n8n/commands/{commandId}/media:
    get:
      operationId: readReservedN8nMedia
      summary: Read private media bound to the original active human send reservation
      description: >-
        Requires integration.n8n.command.media.read and the original workflow key,
        version and execution. Command processing, message sending, bound clean
        variant and current human/nonterminal epoch/revision are revalidated.
        preflight=true returns safe JSON without storage reads, reservation or
        renewal. Neither representation grants a new send authorization. HEAD is
        not exposed; foreign selectors and redirects are prohibited.
      security: [{ automationBasic: [] }]
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: preflight
          in: query
          schema: { type: string, const: 'true' }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Private no-store bytes, or read-only JSON preflight
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, media_id, type, sha256, mime_type, size_bytes]
                properties:
                  valid: { const: true }
                  media_id: { type: string, format: uuid }
                  type: { enum: [image, audio, video] }
                  sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                  mime_type: { type: string }
                  size_bytes: { type: integer, minimum: 1, maximum: 16777216 }
        '400': { description: Invalid query or missing technical identity }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Reserved command not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: Object lost, metadata preserved }
        '503': { description: Storage or integration unavailable }
  /integrations/n8n/events:
    post:
      operationId: recordN8nEvent
      summary: Aplica evento n8n com idempotência, fencing e transação atômica
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/N8nEventRequest' }
      responses:
        '200':
          description: Evento aplicado, negado pelo fence ou reproduzido idempotentemente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/N8nEventResponse' }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /conversations/{conversationId}/media:
    post:
      operationId: uploadChatMedia
      summary: Recebe mídia privada sem assumir o atendimento
      description: >-
        Campos kind, origin e expectedVersion precedem um único campo file.
        Arquivo vazio ou declaração inválida usa 422, excesso de bytes 413.
        Inspeção real de formato/codec ocorre no worker após 202. Replay mede
        bytes reais e declaração sem nova reserva; payload diferente ou
        recebimento ainda ativo usa 409. Upload não altera ownership ou epoch.
        Falhas usam application/problem+json com type, title, status e request_id,
        accepted=false e error.code estável (INVALID_CREDENTIALS, FORBIDDEN,
        MEDIA_CONFLICT, MEDIA_TOO_LARGE, MEDIA_INVALID, MEDIA_RATE_LIMITED ou
        SERVICE_UNAVAILABLE conforme o status).
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [kind, origin, expectedVersion, file]
              properties:
                kind: { type: string, enum: [image, audio, video] }
                origin: { type: string, enum: [attachment, recording] }
                expectedVersion: { type: integer, minimum: 1 }
                file: { type: string, format: binary }
      responses:
        '202':
          description: Upload completo enfileirado, ou replay original
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mediaId, state, statusUrl]
                properties:
                  mediaId: { type: string, format: uuid }
                  state: { type: string, const: processing }
                  statusUrl: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Limite de bytes excedido }
        '422': { description: Declaração ou multipart inválido/vazio }
        '429': { description: Quota ou 12 admissões por sessão/minuto }
        '503': { description: Dependência indisponível ou conclusão incerta }
  /conversations/{conversationId}/media/{mediaId}/content:
    get:
      operationId: getChatMediaContent
      summary: Bytes privados da mídia retida
      description: >-
        Sessão humana e conversation.read obrigatórias. Draft somente autor/admin;
        attached segue leitura da conversa mesmo após oito dias ou encerramento.
        Aceita um único Range bytes fechado, aberto ou sufixo. Respostas usam
        Cache-Control private,no-store, X-Content-Type-Options nosniff e Accept-Ranges bytes.
        Indisponibilidade transitória não altera estado durable ou quota.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { description: Bytes completos, Content-Length exato }
        '206':
          {
            description: Bytes parciais com Content-Range e Content-Length exatos,
          }
        '401': { description: Sessão ausente ou inválida, sem bytes }
        '403': { description: Leitura proibida, sem bytes }
        '404': { description: Mídia não encontrada nesta conversa }
        '409': { description: Mídia ainda não validada/ready }
        '410': { description: Objeto comprovadamente perdido; quota preservada }
        '416':
          {
            description: Range inválido ou fora do objeto,
            Content-Range bytes */size,
          }
        '503':
          {
            description: Storage temporariamente indisponível ou metadata divergente,
          }
  /conversations/{conversationId}/media/{mediaId}:
    get:
      operationId: getChatMediaStatus
      summary: Estado e metadados seguros da mídia privada
      description: >-
        Rascunho somente autor ou COMMERCIAL_ADMIN; mídia vinculada segue a ACL
        de leitura da conversa. Nunca retorna object_key, URL, filename ou
        envelope. Formato inválido depois do202 usa200/state=rejected/reason=invalid_format.
        Sessão ausente/expirada/revogada/inválida401; origem, capacidade ou
        ownership negados403. Dependência indisponível503. Cache private,no-store.
      security:
        - sessionCookie: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado atual sem chaves ou nomes originais
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  [
                    mediaId,
                    kind,
                    origin,
                    state,
                    validationStatus,
                    mimeType,
                    sizeBytes,
                    durationMs,
                  ]
                properties:
                  mediaId: { type: string, format: uuid }
                  kind: { type: string, enum: [image, audio, video] }
                  origin: { type: string, enum: [attachment, recording] }
                  state:
                    {
                      type: string,
                      enum:
                        [
                          uploaded,
                          processing,
                          ready,
                          attached,
                          rejected,
                          unavailable,
                          lost,
                        ],
                    }
                  validationStatus: { type: string }
                  mimeType: { type: [string, 'null'] }
                  sizeBytes: { type: [integer, 'null'], minimum: 1 }
                  durationMs: { type: [integer, 'null'], minimum: 0 }
                  reason: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Mídia ausente na conversa }
        '503': { description: Dependência indisponível }
  /integrations/n8n/store-orders:
    post:
      operationId: recordStoreOrder
      summary: Registra o pedido pago da loja do site (ADR 028)
      description: >-
        Ação store.order.record, só do AUTOMATION_EXECUTOR. O workflow n8n
        "Silmer | Loja | Checkout InfinitePay" chama depois que o
        payment_check da InfinitePay confirma o Pix (paid e amount maior ou
        igual ao valor). O CRM confere o pedido com o próprio catálogo da loja
        e cria um pedido confirmado, travado, sem conversa nem contato, ao
        preço do catálogo. A chave natural é o `pedido_id`: os mesmos dados
        respondem 200 com o mesmo pedido, antes do catálogo; o `receipt_url`
        que antes faltava é gravado e responde 200; dados que diferem só em
        `pagamento.pago_em` (duas execuções do n8n) também respondem 200 com
        o mesmo `numero`, e o pedido mantém o primeiro instante (ADR 031,
        LOJ-37); dados diferentes ou outro comprovante, ou um
        `transaction_nsu` de outro pedido, respondem 409.
        `Idempotency-Key` é o mesmo texto de `pedido_id`. `X-Correlation-Id`
        precisa ser um UUID (ou 16 a 64 hexadecimais) — use o próprio
        `pedido_id`. Até 60 chamadas por minuto (429 RATE_LIMITED com
        Retry-After, antes da credencial). Corpo JSON até 16 KB. Desligada
        (404) até STORE_ORDERS_HMAC_KEY existir. As URLs da resposta partem
        de APP_BASE_URL; sem ela, saem relativas.
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreOrderRecord' }
      responses:
        '201':
          description: Pedido criado
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreOrderRecorded' }
        '200':
          description: >-
            Pedido já registrado com os mesmos dados (ou com outro
            `pago_em`, mantido o primeiro); ou o comprovante que faltava foi
            gravado agora (`comprovante_registrado` true).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreOrderRecorded' }
        '400':
          description: >-
            INVALID_REQUEST (corpo malformado, chave faltando ou de tipo
            errado), UNKNOWN_REQUEST_FIELD, UNSUPPORTED_SCHEMA_VERSION,
            INVALID_STORE_NUMBER, INVALID_RECEIPT_URL, INVALID_PAID_AT,
            INVALID_CUSTOMER, INVALID_IDEMPOTENCY_KEY, INVALID_CORRELATION_ID
            e INVALID_X_SILMER_* dos cabeçalhos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '404': { description: Loja do site não configurada neste ambiente }
        '409':
          description: STORE_ORDER_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/N8nProblem' }
        '413': { $ref: '#/components/responses/N8nProblem' }
        '415': { $ref: '#/components/responses/N8nProblem' }
        '422':
          description: >-
            STORE_CATALOG_MISMATCH, AMOUNT_BELOW_PRICE, TEST_REFUSED ou
            PAYMENT_METHOD_UNSUPPORTED. Nada é gravado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/N8nProblem' }
        '429':
          description: RATE_LIMITED
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /conversations/{conversationId}/messages:
    post:
      operationId: sendHumanConversationMessage
      summary: Persiste a intenção humana e agenda o comando idempotente ao n8n
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanMessageCommand' }
      responses:
        '202': { description: Estado oficial e outbox gravados atomicamente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/{command}:
    post:
      operationId: changeConversationAutomationMode
      summary: Executa takeover humano
      description: >-
        A conversa com uma pessoa nunca volta para o bot (ADR 015). O comando
        `return-to-ai` foi removido: a rota não existe e responde 404, como
        qualquer rota desconhecida, antes da autenticação e sem tocar a
        conversa.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: command
          in: path
          required: true
          schema: { type: string, enum: [takeover] }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202': { description: Estado oficial, auditoria e outbox gravados }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          {
            description: 'Comando inexistente, inclusive `return-to-ai` (ADR 015)',
          }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/close:
    post:
      operationId: closeConversation
      summary: Encerra explicitamente o ciclo de atendimento
      description: >-
        Somente o responsável ou administrador. Não altera o estado dos
        pedidos; se houver pendente, requer reconhecimento explícito.
        Nova mensagem válida abre um novo ciclo para a mesma identidade.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseConversationCommand' }
      responses:
        '202': { description: Ciclo encerrado, auditado e notificado ao n8n }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/archive:
    post:
      operationId: archiveConversation
      summary: Retira uma conversa ativa da Caixa de Entrada sem encerrá-la
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202':
          {
            description: 'Conversa arquivada, com auditoria e atualização em tempo real',
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/unarchive:
    post:
      operationId: unarchiveConversation
      summary: Restaura uma conversa arquivada à Caixa de Entrada
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202':
          {
            description: 'Conversa desarquivada, com auditoria e atualização em tempo real',
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /handoffs/{handoffId}/claim:
    post:
      operationId: claimHumanHandoff
      summary: Reivindica atomicamente um handoff compatível ainda sem responsável
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - name: handoffId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffClaimRequest' }
      responses:
        '200': { description: Handoff atribuído à pessoa autenticada }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders:
    get:
      operationId: listOrders
      summary: Lista pedidos por status, com busca e paginação
      description: >-
        Ação order.read. Sem status, retorna Todos. A busca aceita número do
        pedido ou nome do cliente. Telefone completo deve ser enviado em
        POST /orders/search para não entrar em URL e logs. O nome do cliente
        é buscado também nos pedidos manuais sem conversa. Um pedido da loja
        é achado pelo número ou pelo número da loja (LJ-XXXXXXXX, ADR 028).
        `counts` traz o total de cada grupo
        (Confirmados e Pendentes) para a busca atual, independentemente da
        página.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/OrderStatus' },
          }
        - name: origin
          in: query
          description: >-
            ADR 027: `loja` mostra só os pedidos da loja do site (filtro "Loja
            do site"); `atendimento`, os pedidos de atendimento, inclusive manuais.
          schema: { $ref: '#/components/schemas/OrderOrigin' }
        - name: delivery
          in: query
          description: >-
            Painel: `overdue` lista os pedidos confirmados cuja entrega
            prometida já passou sem "Entregue em"; `due_soon`, os prometidos de
            hoje até seis dias depois (dias de São Paulo). Ordena pela entrega
            prometida, devolve até 100 itens sem cursor e não combina com
            `status`, `origin`, `q` ou `cursor`. Pedido da loja não tem entrega
            prometida e fica fora.
          schema: { type: string, enum: [overdue, due_soon] }
        - name: owner
          in: query
          description: >-
            Painel ("Meus pedidos pendentes"): `me` mantém só os pedidos da
            pessoa da sessão — o pedido manual de que ela é dona ou o pedido
            de uma conversa atribuída a ela. Nenhum outro valor é aceito; o
            dono nunca viaja na URL. Combina com `status` e `q`, não com
            `delivery`.
          schema: { type: string, enum: [me] }
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200':
          description: Página de pedidos
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createManualOrderForContact
      summary: Cria pedido pendente para um cliente sem exigir conversa
      description: >-
        Ação order.create. O vendedor autenticado é o responsável inicial.
        Cada chave de idempotência identifica um único pedido; a ficha nasce
        editável pelas rotas usuais do pedido.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualOrderCreateRequest' }
      responses:
        '201':
          description: Pedido criado ou repetição idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/search:
    post:
      operationId: searchOrdersPrivate
      summary: Busca privada de pedidos, inclusive por telefone completo
      description: Ação order.read. Telefone é comparado por HMAC nas fontes disponíveis; a consulta exige sessão, Origin e CSRF e não pode ser armazenada em cache.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [q]
              properties:
                q: { type: string, minLength: 1, maxLength: 128 }
                status: { $ref: '#/components/schemas/OrderStatus' }
                origin: { $ref: '#/components/schemas/OrderOrigin' }
                cursor: { type: string, maxLength: 1024 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página de pedidos da consulta privada
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Limite temporário de buscas privadas excedido }
  /orders/summary:
    get:
      operationId: getOrdersSummary
      summary: Retorna indicadores globais dos pedidos
      description: >-
        Ação order.read. Totais de todos os pedidos, sem recorte pela página,
        busca ou status da listagem. Vendas e peças somam somente pedidos
        confirmados; pendentes são contados à parte. Valores em centavos. Os
        pedidos da loja do site contam como qualquer venda; pedidos de teste
        (isTest) ficam fora (ADR 027). storeNewCount conta os pedidos novos do
        site — da loja, sem teste, com a ficha nunca impressa — e
        storeNewOldestPaidAt é o instante em que a InfinitePay confirmou o Pix
        do mais antigo deles, nulo quando não há (ADR 031). `period` soma as
        vendas confirmadas cujo dia do pedido cai no período escolhido;
        `deliveries` conta as entregas prometidas vencidas sem "Entregue em" e
        as dos próximos sete dias. Os dias são de São Paulo e calculados no
        servidor.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - name: period
          in: query
          description: >-
            Painel: `hoje`, `7dias` (hoje e os seis dias anteriores) ou `mes`
            (do dia 1 até hoje). Padrão `hoje`.
          schema: { type: string, enum: [hoje, 7dias, mes], default: hoje }
      responses:
        '200':
          description: Indicadores globais de pedidos
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersSummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Retorna um pedido com a ficha completa
      description: Ação order.read.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Pedido
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
  /conversations/{conversationId}/order:
    get:
      operationId: getConversationOrder
      summary: Retorna o pedido atual da conversa
      description: >-
        Ação order.read. Devolve o pedido pendente da conversa ou, se não
        houver, o último confirmado. `order` é null quando a conversa não tem
        pedido.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Pedido atual ou null
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationOrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/orders:
    post:
      operationId: createConversationOrder
      summary: Cria manualmente o pedido pendente da conversa
      description: >-
        Ação order.create, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        O pedido nasce pendente, com número NN-CRM reservado, pré-preenchido
        com a pré-ficha atual da conversa. Se a conversa já tem pedido
        pendente, responde 200 com o pedido existente.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '200':
          description: Pedido pendente já existente ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '201':
          description: Pedido pendente criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/sections/{section}:
    patch:
      operationId: patchOrderSection
      summary: Substitui uma seção inteira da ficha de um pedido pendente
      description: >-
        Ação order.edit, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        `value` substitui a seção inteira; total de peças e campos faltantes
        são recalculados. Pedido confirmado não aceita edição (409); é preciso
        reabrir.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: section
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OrderSection' }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderSectionPatchRequest' }
      responses:
        '200':
          description: Seção gravada ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/store-correction:
    post:
      operationId: correctStoreOrderQuantity
      summary: Corrige quantidade confirmada pelo usuario num pedido da loja
      description: >-
        LOJ-39/40/41. Sessao humana com COMMERCIAL_ADMIN, CSRF, Origin e
        Idempotency-Key; guarda order.edit e administrador validado na transacao.
        Somente produto unitario, um item e uma grade, sem teste. Exige versao
        e valores anteriores exatos. Calcula subtotal pelo catalogo, recusa
        pagamento insuficiente (422 AMOUNT_BELOW_PRICE). Preserva IDs, pagamento,
        confirmacao, primeira impressao e fingerprint original. Audita sem PII.
        Mesma chave/corpo retorna o resultado. Outra chave com snapshot obsoleto
        retorna 409 VERSION_CONFLICT ou STORE_ORDER_CONFLICT. Chave reutilizada
        com outro corpo retorna 409 IDEMPOTENCY_KEY_REUSED. Campos invalidos
        retornam 400 INVALID_REQUEST, INVALID_EXPECTED_VERSION ou INVALID_CORRECTION_REASON.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  expectedVersion,
                  expectedQuantity,
                  expectedAmountCents,
                  quantity,
                  reason,
                ]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                expectedQuantity: { type: integer, minimum: 1 }
                expectedAmountCents: { type: integer, minimum: 1 }
                quantity: { type: integer, minimum: 1, maximum: 10 }
                reason: { type: string, const: USER_CONFIRMED_QUANTITY }
      responses:
        '200':
          description: Pedido corrigido ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/confirm:
    post:
      operationId: confirmOrder
      summary: Confirma (gera) o pedido com valor final e forma de pagamento
      description: >-
        Ação order.confirm, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        Exige valor final no formato brasileiro (ex.: 4.820,00) maior que zero,
        forma de pagamento válida (campo paymentCondition), ao menos um item e,
        em cada item, os pontos principais das ADRs 016 e 020 (tipo, cor,
        técnica em tipo_servico, ao menos um tecido, ao menos uma linha de
        tamanho e gola), quem faz a arte do pedido (chave artwork) e a entrega
        prometida do resumo como dia AAAA-MM-DD; paidOn e deliveredOn não
        bloqueiam. Recusa com 422 ORDER_NOT_CONFIRMABLE e as chaves de
        Order.missingFields que faltam. Grava valor, forma de pagamento,
        autor, horário e data do pedido. Numa nova confirmação depois
        de reabrir, autor, horário e data passam a ser os da nova confirmação.
        Confirmações concorrentes sobre a mesma versão: uma vence e a outra
        recebe 409.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderConfirmRequest' }
      responses:
        '200':
          description: Pedido confirmado ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/reopen:
    post:
      operationId: reopenOrder
      summary: Reabre um pedido confirmado
      description: >-
        Ação order.reopen, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        Só a partir de confirmado. Volta a pendente mantendo número, valor e
        condição, registra autor e horário da reabertura e bloqueia a
        impressão.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderReopenRequest' }
      responses:
        '200':
          description: Pedido reaberto ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/delivery-tasks:
    get:
      operationId: listManualOrderDeliveryTasks
      summary: Lista as entregas a confirmar pelo vendedor da sessão
      description: >-
        PLA-10 / T136. Somente pedidos manuais sem conversa, confirmados, sem
        Entregue em e que não são testes, cujo responsável é a pessoa da sessão.
        Ordenados pela entrega prometida e número; pedidos sem prazo vêm ao fim.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Afazeres de entrega do responsável
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{orderId}/delivery-confirmation:
    post:
      operationId: confirmManualOrderDelivery
      summary: Confirma a entrega e registra o dia de hoje em São Paulo
      description: >-
        PLA-11 / T136. Autoriza com order.milestones, restrito ao responsável ou
        COMMERCIAL_ADMIN. Apenas pedido manual confirmado e fora de teste.
        Preserva Pago em, status e snapshot; não aceita data do cliente.
        Auditoria order.delivery.confirm, controle de versão e replay idempotente.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Entrega confirmada ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/milestones:
    patch:
      operationId: recordOrderMilestones
      summary: Registra quando o cliente pagou e quando o pedido foi entregue
      description: >-
        Ação order.milestones, restrita ao dono da conversa ou a
        COMMERCIAL_ADMIN (ADR 008). Vale para pedido pendente ou confirmado,
        sem reabrir, e nunca muda o status nem bloqueia a confirmação. As duas
        datas vão juntas para pedidos com conversa; em pedidos manuais sem
        conversa somente paidOn é aceito e deliveredOn é preservado (ADR 039).
        null limpa a data editável. Data inválida ou depois
        de hoje (horário de São Paulo) responde 422 INVALID_DATE com os campos
        recusados.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderMilestonesRequest' }
      responses:
        '200':
          description: Datas gravadas ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/print:
    get:
      operationId: printOrder
      summary: Retorna a ficha de pedido no template ficha-canonical-v3
      description: >-
        Ação order.print, disponível a qualquer usuário operacional. Só para
        pedido confirmado; pendente responde 409 ORDER_NOT_CONFIRMED. HTML A4
        paisagem, duas páginas, impresso pelo navegador. O documento não traz
        valor, condição de pagamento nem a faixa de amostra sintética; vendedor
        é quem confirmou, data é a data do pedido e o controle de produção sai
        em branco. Um pedido da loja do site (ADR 027) sai na ficha
        simplificada ficha-loja-v1 (A4 retrato, uma página, só os campos
        padrão). Com download=1, o mesmo documento vem como anexo
        pedido-NN-CRM.html. ADR 031: a primeira impressão ou download da ficha
        de um pedido da loja por uma pessoa grava fichaFirstPrintedAt e
        fichaFirstPrintedBy, publica o evento order.ficha_first_printed (ao
        vivo inbox.order.changed) e audita order.ficha.first_print, sem PII;
        as seguintes não mudam nada. A autorização não muda.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
        - name: download
          in: query
          schema: { type: string, const: '1' }
      responses:
        '200':
          description: Documento HTML pronto para impressão
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/pdf:
    get:
      operationId: downloadOrderPdf
      summary: Gera a ficha de pedido em PDF para baixar ou compartilhar
      description: >-
        ADR 037. Usa order.print e o mesmo template da rota HTML, somente para
        pedido confirmado. Responde com o anexo privado pedido-NN-CRM.pdf.
        A geração bem-sucedida da primeira ficha de um pedido da loja registra
        o primeiro acesso da ADR 031; HEAD, falha e acesso negado não registram.
        O servidor não armazena o PDF nem envia ao WhatsApp.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Ficha em PDF
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/files:
    get:
      operationId: listOrderFiles
      summary: Lista a arte final e os arquivos da arte do pedido (ADR 023)
      description: >-
        Ação order.read. Sem OBJECT_STORAGE_* configurado responde 503 e o
        resto do pedido continua disponível.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Arquivos do pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderFiles' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: uploadOrderFile
      summary: Envia um arquivo da arte ou a arte final
      description: >-
        Ação order.edit, restrita ao dono da conversa ou a COMMERCIAL_ADMIN e
        ao pedido pendente (409 ORDER_STATUS_CONFLICT). Até 5 arquivos
        `reference` (409 FILE_LIMIT_REACHED) e uma arte `final`, que substitui
        a anterior; 10 MB cada (413 FILE_TOO_LARGE). A extensão precisa estar
        na allowlist e o conteúdo precisa ter a assinatura dela (422
        FILE_TYPE_NOT_ALLOWED ou FILE_CONTENT_MISMATCH). A sessão é checada
        antes de o corpo ser lido. Replay com a mesma Idempotency-Key e os
        mesmos bytes devolve a primeira resposta.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/OrderFileUpload' }
      responses:
        '201':
          description: Arquivo guardado ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderFiles' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '413': { $ref: '#/components/responses/OrderUnprocessable' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/files/{fileId}:
    delete:
      operationId: removeOrderFile
      summary: Remove um arquivo da arte ou a arte final
      description: >-
        Ação order.edit, mesmas regras do envio. Apaga a linha e os objetos
        (arquivo e miniatura) do RustFS.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderFileId'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Arquivos que restaram ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderFiles' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/files/{fileId}/content:
    get:
      operationId: downloadOrderFile
      summary: Baixa o arquivo original como anexo
      description: >-
        Ação order.read, também para pedido confirmado. Sempre anexo, com
        nosniff e CSP sandbox; o download entra na auditoria.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderFileId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Bytes do arquivo
          headers:
            Content-Disposition:
              { schema: { type: string, pattern: '^attachment; ' } }
            Content-Security-Policy:
              { schema: { type: string, const: "default-src 'none'; sandbox" } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/files/{fileId}/thumbnail:
    get:
      operationId: getOrderFileThumbnail
      summary: Miniatura WebP de uma imagem enviada
      description: >-
        Ação order.read. Só existe para PNG, JPEG e WebP enviados com
        miniatura; os demais respondem 404 FILE_NOT_FOUND.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderFileId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Miniatura de até 320 px
          content:
            image/webp:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /finance/orders:
    get:
      operationId: listFinanceOrders
      summary: Lista confirmados integralmente pagos e não teste (FINQ-04–06)
      description: >-
        Financeiro ou Admin ativo. Legados manuais não revisados ficam fora.
        Aguardando ordena paidOn ascendente; concluídos completedAt descendente,
        com número e id como desempate. Contagens usam o mesmo universo.
        Respostas privadas no-store; nenhuma conversa, arte ou dado fiscal.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - in: query
          name: status
          schema: { type: string, enum: [waiting, completed], default: waiting }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Página da fila financeira
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /finance/orders/{orderId}:
    get:
      operationId: getFinanceOrder
      summary: Consulta mínima e histórico financeiro de pedido elegível
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Consulta; canManage false para Admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceResponse' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /finance/orders/{orderId}/complete:
    post:
      operationId: completeFinanceOrder
      summary: Declara rotina concluída (Nota criada); exclusivo Financeiro
      description: >-
        Não comprova autorização Sefaz. Revalida ator, elegibilidade e versões
        sob lock; estado, histórico, auditoria e idempotência na mesma transação.
        Limite 30 comandos/minuto. Admin não recebe esta ação.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceCommand' }
      responses:
        '200':
          description: Conclusão ou replay do mesmo comando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Limite de comandos excedido }
        '503': { $ref: '#/components/responses/Unavailable' }
  /finance/orders/{orderId}/reopen:
    post:
      operationId: reopenFinanceOrder
      summary: Desfaz check preservando histórico; exclusivo Financeiro
      description: >-
        Usa as mesmas garantias transacionais de complete. Não reabre o
        pedido comercial. Conflito ou resposta incerta exige releitura.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceCommand' }
      responses:
        '200':
          description: Correção ou replay do mesmo comando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Limite de comandos excedido }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    automationBasic:
      type: http
      scheme: basic
      description: Credencial exclusiva e rotacionável do AUTOMATION_EXECUTOR.
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: Cookie opaco HttpOnly, Secure e SameSite=Lax.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Deve corresponder ao cookie Secure crm_csrf.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    OriginOptional:
      name: Origin
      in: header
      required: false
      description: Obrigatório para autenticação humana; não usado pelo ator técnico.
      schema: { type: string, format: uri }
    OrderFileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    HumanReadOrigin:
      name: Origin
      in: header
      required: false
      description: >-
        Se presente, deve pertencer à allowlist. Se ausente, o navegador deve
        enviar Sec-Fetch-Site same-origin ou none.
      schema: { type: string, format: uri }
    BootstrapToken:
      name: X-Bootstrap-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkflowKey:
      name: X-Silmer-Workflow-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkflowVersion:
      name: X-Silmer-Workflow-Version
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ExecutionId:
      name: X-Silmer-Execution-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ContentSha256:
      name: X-Silmer-Content-SHA256
      in: header
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DealId:
      name: dealId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ConversationShippingQuoteResponse:
      type: object
      additionalProperties: false
      required: [quote]
      properties:
        quote:
          oneOf:
            - type: 'null'
            - type: object
              required:
                [
                  id,
                  conversationId,
                  subjectId,
                  orderId,
                  orderVersion,
                  input,
                  services,
                  unavailable,
                  totalPieces,
                  createdAt,
                  createdBy,
                  selectedServiceId,
                  stale,
                ]
              properties:
                id: { type: string }
                conversationId: { type: string }
                subjectId: { type: string }
                orderId: { type: string }
                orderVersion: { type: integer }
                environment: { type: string, enum: [sandbox, production] }
                input:
                  type: object
                  description: CEPs, peso, medidas e seguro informados; cifrados na persistência
                services:
                  type: array
                  items:
                    type: object
                    required: [id, company, name, priceCents, deliveryDays]
                    properties:
                      id: { type: integer }
                      company: { type: string }
                      name: { type: string }
                      priceCents: { type: integer, minimum: 0 }
                      deliveryDays: { type: integer, minimum: 0 }
                unavailable:
                  type: array
                  items: { type: object }
                totalPieces: { type: integer }
                selectedServiceId: { type: [integer, 'null'] }
                selectedAt: { type: [string, 'null'], format: date-time }
                createdAt: { type: string, format: date-time }
                createdBy:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
                stale: { type: boolean }
    FinanceCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedFinanceVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        expectedFinanceVersion: { type: integer, minimum: 0 }
    FinancePage:
      type: object
      additionalProperties: false
      required: [items, counts, nextCursor]
      properties:
        items:
          type: array
          items:
            allOf: [{ $ref: '#/components/schemas/FinanceOrder' }]
            unevaluatedProperties: false
        counts:
          type: object
          additionalProperties: false
          required: [waiting, completed]
          properties:
            waiting: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
        nextCursor: { type: [string, 'null'] }
    FinanceOrder:
      type: object
      required:
        [
          id,
          number,
          clientName,
          origin,
          isManual,
          ownerName,
          totalPieces,
          finalAmountCents,
          paidOn,
          deliveryOn,
          version,
          financeVersion,
          completedAt,
          completedByName,
        ]
      properties:
        id: { type: string }
        number: { type: string }
        clientName: { type: string }
        origin: { $ref: '#/components/schemas/OrderOrigin' }
        isManual: { type: boolean }
        ownerName: { type: string }
        totalPieces: { type: integer, minimum: 1 }
        finalAmountCents: { type: integer, minimum: 1 }
        paidOn: { type: string, format: date }
        deliveryOn: { type: [string, 'null'], format: date }
        version: { type: integer, minimum: 1 }
        financeVersion: { type: integer, minimum: 0 }
        completedAt: { type: [string, 'null'], format: date-time }
        completedByName: { type: [string, 'null'] }
    FinanceResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          unevaluatedProperties: false
          allOf:
            - $ref: '#/components/schemas/FinanceOrder'
            - type: object
              required: [canManage, items, history]
              properties:
                canManage: { type: boolean }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/FinanceItem' }
                history:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, action, actorName, occurredAt, reason]
                    properties:
                      id: { type: string }
                      action:
                        {
                          type: string,
                          enum: [completed, reopened, invalidated],
                        }
                      actorName: { type: string }
                      occurredAt: { type: string, format: date-time }
                      reason: { type: string }
    FinanceItem:
      type: object
      additionalProperties: false
      properties:
        tipo: { type: string }
        cor: { type: string }
        grade:
          type: array
          items: { $ref: '#/components/schemas/FichaGradeLine' }
        malhas:
          type: array
          items: { type: string }
        tipo_servico: { type: string }
        gola: { type: string }
        publico: { type: string }
    N8nMode:
      type: string
      enum: [ai_active, handoff_pending, human_active, closed]
    N8nInboundRequest:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties: { channel: { const: site_chat } }
          then:
            required: [provider]
            properties:
              provider: { const: site }
              contact:
                required: [external_id]
                not: { required: [wa_id] }
          else:
            not: { required: [site_contact] }
      required:
        [
          schema_version,
          event_id,
          occurred_at,
          channel,
          contact,
          message,
          metadata,
        ]
      properties:
        schema_version: { type: string, const: '1.0' }
        event_id: { type: string, minLength: 1, maxLength: 512 }
        occurred_at: { type: string, format: date-time }
        channel: { type: string, enum: [whatsapp, site_chat] }
        provider:
          type: string
          description: Para site_chat, usar site. WhatsApp mantém o provedor do canal.
        contact:
          type: object
          anyOf:
            - required: [external_id]
            - required: [wa_id]
          properties:
            external_id: { type: string, minLength: 1, maxLength: 512 }
            wa_id: { type: string, minLength: 1, maxLength: 512 }
            name: { type: string, maxLength: 512 }
        site_contact:
          type: object
          additionalProperties: false
          required: [name, phone]
          description: Obrigatório no primeiro ingresso site_chat da Conversa; nos demais, se enviado, deve repetir a mesma declaração. Declaração não confirmada; não vincula identidade WhatsApp.
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            phone: { type: string, minLength: 1, maxLength: 32 }
        message:
          type: object
          additionalProperties: true
          required: [external_id, type]
          properties:
            external_id: { type: string, minLength: 1, maxLength: 512 }
            type:
              type: string
              enum: [text, image, audio, video, document, button, interactive]
            text: { type: string, maxLength: 65536 }
        metadata:
          type: object
          additionalProperties: true
          anyOf:
            - required: [provider_account_id]
            - required: [phone_number_id]
    N8nInboundResponse:
      type: object
      additionalProperties: true
      required:
        [
          accepted,
          duplicate,
          conversation_id,
          source_revision,
          automation_epoch,
          mode,
          recent_messages,
          briefing,
          subjects,
          source_subject_ids,
        ]
      properties:
        accepted: { type: boolean, const: true }
        duplicate: { type: boolean }
        conversation_id: { type: string }
        source_revision: { type: integer, minimum: 1 }
        conversation_version: { type: integer, minimum: 1 }
        contact_id: { type: string }
        automation_epoch: { type: integer, minimum: 0 }
        mode: { $ref: '#/components/schemas/N8nMode' }
        recent_messages: { type: array, items: { type: object } }
        briefing_version: { type: integer, minimum: 0 }
        briefing:
          type: object
          additionalProperties: true
          description: Compatibilidade legada. Novos workflows usam o briefing de cada Assunto em subjects.
        subjects:
          type: array
          description: Assuntos visíveis da Conversa, cada um com seu Pedido e briefing próprios.
          items:
            type: object
            additionalProperties: true
            required: [subject_id, order_id, briefing]
            properties:
              subject_id: { type: string }
              order_id: { type: [string, 'null'] }
              order_number: { type: [string, 'null'] }
              order_status: { type: [string, 'null'] }
              kind: { type: string }
              is_current: { type: boolean }
              selected_source:
                type: [string, 'null']
                enum: [human, agent, null]
              position: { type: integer }
              briefing_version: { type: integer, minimum: 0 }
              briefing: { type: object, additionalProperties: true }
        source_subject_ids:
          type: array
          items: { type: string }
          description: Assuntos ligados à mensagem recebida; mais de um exige esclarecimento ou transferência.
        site_contact:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
          description: Só nome da declaração do site; telefone e candidatos não são devolvidos ao workflow.
        site_contact_match:
          type: string
          enum: [new, existing, ambiguous]
          description: Classificação interna; não enviar ao modelo ou visitante.
        automation_message_count:
          type: integer
          minimum: 0
          description: Mensagens do agente já reservadas nesta Conversa (ADR 009).
        automation_message_cap:
          type: integer
          minimum: 2
          description: Teto de mensagens do agente; a última vaga é do aviso de transferência.
        sellers:
          type: array
          description: Vendedores ativos, só id e primeiro nome (ADR 009).
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    N8nAttachmentRequest:
      type: object
      additionalProperties: false
      required: [schema_version, external_id, file]
      properties:
        schema_version: { type: string, const: '1.0' }
        external_id: { type: string, minLength: 1, maxLength: 512 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime_type: { type: string, minLength: 1, maxLength: 255 }
        file: { type: string, format: binary }
    N8nEventRequest:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, event_type, occurred_at]
      properties:
        schema_version: { type: string, const: '1.0' }
        event_id: { type: string, minLength: 1, maxLength: 512 }
        event_type:
          type: string
          enum:
            [
              message.send.requested,
              message.sent,
              message.delivered,
              message.read,
              message.failed,
              message.send.unknown,
              handoff.requested,
              workflow.failed,
              order.assistance.observed,
            ]
        occurred_at: { type: string, format: date-time }
        conversation_id: { type: [string, 'null'] }
        observation:
          type: object
          additionalProperties: false
          required: [signal]
          description: OA-02. Somente order.assistance.observed; não autoriza envio nem criação.
          properties:
            signal: { enum: [purchase_confirmed, not_ready, withdrawn, unsupported, uncertain, analysis_failed] }
            product_summary: { type: [string, 'null'], maxLength: 256 }
            evidence_message_id: { type: [string, 'null'] }
            subject_id: { type: [string, 'null'] }
            briefing_patch: { type: [object, 'null'], description: Mesma allowlist de qualificação; texto até 2000 caracteres, sem preço/pagamento/status }
        automation_epoch: { type: integer, minimum: 0 }
        source_revision: { type: integer, minimum: 1 }
        target_contract:
          type: string
          const: subject-v1
          description: Ativa o contrato de alvo explícito por Assunto para eventos do novo workflow.
        subject_id:
          type: string
          description: Obrigatório com order_id em alterações de briefing pelo agente sob target_contract subject-v1.
        order_id:
          type: string
          description: Pedido explicitamente escolhido para a alteração; deve pertencer ao subject_id.
        command_id: { type: string, maxLength: 512 }
        external_message_id: { type: string, maxLength: 512 }
        message:
          type: object
          additionalProperties: true
          description: >-
            message.send.requested humano deve reproduzir a message da outbox.
            Texto conserva o shape legado. Mídia retida usa somente media_id,
            sha256, mime_type, size_bytes, type, text e caption (null para audio),
            com filename/media_url null. Metadados vêm da chat_media vinculada,
            nunca do cliente. Aliases attachment_id/attachmentId/mediaId e URL/key
            arbitrárias são negados409. Legenda/variante/epoch/source divergentes
            não reservam. Replay retorna send_authorized=false.
          properties:
            media_id: { type: string, format: uuid }
            sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            mime_type: { type: string }
            size_bytes: { type: integer, minimum: 1 }
            caption: { type: [string, 'null'], maxLength: 1024 }
        briefing_patch:
          type: object
          additionalProperties: false
          properties:
            artwork_locations: {}
            artwork_status: {}
            artwork_technique: {}
            briefing_status: {}
            city_or_postal_code: {}
            collar: {}
            colors: {}
            customer_name: {}
            customizations: {}
            delivery_address: {}
            delivery_mode: {}
            fabrics: {}
            needed_by: {}
            next_required_field: {}
            notes: {}
            numbers: {}
            order_name: {}
            pickup_location: {}
            product_model: {}
            product_type: {}
            purchase_profile: {}
            purpose: {}
            quantity: {}
            segment: {}
            sizes: {}
            sponsors: {}
        handoff:
          type: object
          additionalProperties: true
          properties:
            reason: { type: string }
            summary: { type: string }
            notice:
              type: object
              additionalProperties: false
              required: [command_id, text]
              description: Aviso ao cliente reservado na mesma transação do handoff (ADR 009).
              properties:
                command_id: { type: string, minLength: 1, maxLength: 512 }
                text: { type: string, minLength: 1, maxLength: 4096 }
        failure:
          type: object
          additionalProperties: true
          description: >-
            Generic workflow.failed is diagnostic only. The explicit
            phase=before_message_send requires command_id and conversation_id,
            only phase/code keys and one allowlisted code: MEDIA_DOWNLOAD_FAILED,
            MEDIA_INTEGRITY_MISMATCH, MEDIA_UPLOAD_FAILED,
            MEDIA_PREFLIGHT_REJECTED or MEDIA_PREFLIGHT_UNAVAILABLE. It concludes
            processing/sending under the original reservation execution with
            retryable=false and retry_safe=false, even after epoch invalidation.
            It cannot regress sent/delivered/read/outcome_unknown. Use only on
            branches proven to precede Meta/messages; errors after invocation
            require message.send.unknown, never this completion.
        open_order:
          type: boolean
          description: >-
            ADR 056 supersede ADR 014. Campo legado somente em reserva/handoff.
            Runtime publicado não cria Pedido: true retorna awaiting_human
            com opened nulo, sem erro técnico ou reserva de numeração.
    N8nEventResponse:
      type: object
      additionalProperties: true
      required: [accepted]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        send_authorized: { type: boolean }
        reason: { type: string }
        handoff_id: { type: string }
        notice:
          type: object
          description: Só envie o aviso quando send_authorized for true; replay e teto gasto devolvem false.
          properties:
            send_authorized: { type: boolean }
            command_id: { type: [string, 'null'] }
        order:
          description: >-
            ADR 056. Runtime publicado responde awaiting_human ao contrato
            legado, sem criação. Formatos históricos são preservados abaixo.
          oneOf:
            - type: object
              additionalProperties: false
              required: [opened, status]
              properties:
                opened: { type: 'null' }
                status: { const: awaiting_human }
            - type: object
              additionalProperties: false
              required: [opened, id, subject_id, created]
              properties:
                opened: { type: boolean, const: true }
                id: { type: string }
                subject_id: { type: string }
                created: { type: boolean }
            - type: object
              additionalProperties: false
              required: [opened, error]
              properties:
                opened: { type: boolean, const: false }
                error: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
    N8nProblem:
      type: object
      additionalProperties: false
      required:
        [type, title, status, detail, instance, accepted, error, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        accepted: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties: { code: { type: string } }
        request_id: { type: string }
    HumanMessageCommand:
      type: object
      additionalProperties: false
      required: [content, expectedVersion, messageType, reason]
      properties:
        content: { type: object, additionalProperties: true }
        expectedVersion: { type: integer, minimum: 1 }
        messageType: { type: string, enum: [text, image, audio, video] }
        reason: { type: string, minLength: 1, maxLength: 512 }
      description: >-
        CHAT_MEDIA_ENABLED=false impede novos envios image/audio/video (403),
        preservando texto e leitura. Mídia só aceita referência canônica mediaId;
        chave, URL, filename e attachmentId arbitrários são proibidos.
      oneOf:
        - properties:
            messageType: { const: text }
        - properties:
            messageType: { enum: [image, video] }
            content:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId: { type: string, format: uuid }
                caption: { type: string, maxLength: 1024 }
        - properties:
            messageType: { const: audio }
            content:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId: { type: string, format: uuid }
    HumanConversationCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    CloseConversationCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, outcome, acknowledgePending]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [concluido, sem_pedido] }
        acknowledgePending: { type: boolean }
    HandoffClaimRequest:
      type: object
      additionalProperties: false
      required: [expectedHandoffVersion, reasonCode]
      properties:
        expectedHandoffVersion: { type: integer, minimum: 1 }
        expectedConversationVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, minLength: 1, maxLength: 512 }
    Channel:
      type: string
      enum: [instagram, whatsapp, site_chat]
    ConversationState:
      type: string
      enum:
        [
          nova,
          em_analise,
          em_atendimento,
          requer_atencao,
          convertida_em_lead,
          sem_lead,
          encerrada,
        ]
    ContactIdentityView:
      type: object
      additionalProperties: false
      required: [id, channel, kind, externalId, displayHandle, phoneStatus]
      properties:
        id: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        kind: { type: string }
        externalId: { type: string }
        displayHandle: { type: [string, 'null'] }
        phoneStatus: { type: [string, 'null'] }
    ContactView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          label,
          provisional,
          version,
          identities,
          activeDealCount,
          createdAt,
          updatedAt,
          archivedAt,
          latestActivityAt,
        ]
      properties:
        id: { type: string }
        label: { type: string }
        phone:
          {
            type: [string, 'null'],
            description: Telefone operacional do contato. O campo phoneSource indica se foi declarado no site,
            cadastrado manualmente ou confirmado no WhatsApp.,
          }
        phoneSource:
          type: [string, 'null']
          enum: [manual, whatsapp, site_unverified, null]
          description: site_unverified é um telefone informado pela pessoa no chat, sem prova de posse ou correlação com outro contato.
        email: { type: [string, 'null'] }
        registrationStatus:
          type: string
          enum: [complete, incomplete]
          description: >-
            CP-26. complete exige os campos obrigatórios do cadastro, celular
            e e-mail. É o único dado do cadastro exposto na lista.
        registration:
          description: >-
            Somente no detalhe (GET /contacts/{contactId}, servido com
            Cache-Control private, no-store); nunca na lista nem na busca. null
            quando o cadastro nunca foi preenchido.
          oneOf:
            - { $ref: '#/components/schemas/ContactRegistration' }
            - { type: 'null' }
        provisional: { type: boolean }
        version: { type: integer, minimum: 1 }
        identities:
          type: array
          items: { $ref: '#/components/schemas/ContactIdentityView' }
        activeDealCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestActivityAt: { type: string, format: date-time }
    InboxMessageView:
      type: object
      additionalProperties: false
      required:
        [id, direction, type, preview, status, deliveryStatus, occurredAt]
      properties:
        id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        type: { type: string }
        preview: { type: string }
        status: { type: string }
        deliveryStatus: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        authorKind: { type: [string, 'null'] }
        authorId: { type: [string, 'null'] }
        deliveryMode:
          type: [string, 'null']
          enum: [dev, official, null]
          description: Origem do único recibo de reserva; DEV não comprova entrega real.
        media:
          oneOf:
            - { $ref: '#/components/schemas/InboxPersistentMedia' }
            - { type: 'null' }
    InboxPersistentMedia:
      type: object
      additionalProperties: false
      required:
        [mediaId, kind, state, mimeType, sizeBytes, durationMs, contentUrl]
      properties:
        mediaId: { type: string, format: uuid }
        kind: { type: string, enum: [image, audio, video] }
        state: { type: string }
        mimeType: { type: [string, 'null'] }
        sizeBytes: { type: [integer, 'null'], minimum: 0 }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        contentUrl:
          type: [string, 'null']
          description: Rota relativa CRM com ACL; null quando indisponível, nunca URL storage.
    InboxConversationView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          state,
          automationState,
          automationEpoch,
          version,
          channel,
          contact,
          lastMessage,
          requiresAttention,
          openedAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/ConversationState' }
        automationState: { type: string, enum: [assistant, human] }
        automationEpoch: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        channel: { $ref: '#/components/schemas/Channel' }
        contact:
          type: object
          additionalProperties: false
          required: [id, label, externalId, displayHandle]
          properties:
            id: { type: string }
            label: { type: string }
            externalId: { type: string }
            displayHandle: { type: [string, 'null'] }
        assignedUser:
          {
            oneOf:
              [
                { $ref: '#/components/schemas/OperationalUserRef' },
                { type: 'null' },
              ],
          }
        deal: { type: [object, 'null'] }
        handoff:
          type: [object, 'null']
          description: Handoff aberto (pendente ou aceito) da conversa.
          properties:
            id: { type: string }
            status: { type: string, enum: [pending, accepted] }
            reasonCode:
              type: string
              description: Motivo da parada do agente (crm.handoffs.reason_code).
            createdAt:
              type: string
              format: date-time
              description: Início da espera; base do tempo parado.
            dueAt: { type: string, format: date-time }
            targetRole: { type: string }
            version: { type: integer, minimum: 1 }
        order:
          description: >-
            Pedido atual da conversa: o pendente ou, se não houver, o último
            confirmado.
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, number, status]
              properties:
                id: { type: string }
                number: { type: string, pattern: '^[0-9]{2,}-CRM$' }
                status: { $ref: '#/components/schemas/OrderStatus' }
                readyForConfirmation:
                  type: boolean
                  description: Validação persistida do pedido pendente; não é inferida do handoff ou da pré-ficha.
            - { type: 'null' }
        lastMessage:
          {
            oneOf:
              [
                { $ref: '#/components/schemas/InboxMessageView' },
                { type: 'null' },
              ],
          }
        reviewOrder:
          type: [object, 'null']
          additionalProperties: false
          description: Pedido elegível para revisão, com alvo explícito; não substitui order canônico.
          properties:
            id: { type: string }
            number: { type: string }
            status: { type: string, const: pendente }
            readyForConfirmation: { type: boolean, const: true }
        hasPendingOrder:
          type: boolean
          description: >-
            Há pedido pendente ligado diretamente à conversa ou por Assunto,
            mesmo que order seja null ou confirmado. Exige confirmação
            consciente para encerrar o atendimento sem alterar os pedidos
            (CP-10); não substitui a validação transacional do comando.
        requiresAttention: { type: boolean }
        waitingSince:
          type: [string, 'null']
          format: date-time
          description: Espera humana; avisos do bot não reiniciam o instante.
        queuePosition:
          type: string
          format: date-time
          description: Instante estável de ordenação/cursor das filas workQueue.
        deliveryIssue:
          type: [object, 'null']
          additionalProperties: false
          properties:
            status: { type: string, enum: [failed, outcome_unknown] }
            occurredAt: { type: string, format: date-time }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
